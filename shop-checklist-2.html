<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop tasks</title>
<style>
  :root {
    --clay: #C4714A;
    --clay-light: #F5EBE4;
    --clay-dark: #8B4D2F;
    --ink: #1E1A17;
    --ink-mid: #6B5F57;
    --ink-faint: #E8E0DA;
    --white: #FDFAF8;
    --green: #2A7A52;
    --green-light: #E4F2EB;
    --amber: #B8710A;
    --amber-light: #FDF0DC;
    --blue-light: #E8F0FB;
    --blue: #2A5BA8;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--white); color: var(--ink); min-height: 100vh; }

  /* NAV */
  .nav { display: flex; background: var(--ink); position: sticky; top: 0; z-index: 100; }
  .nav-btn { flex: 1; padding: 14px 8px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5); background: none; border: none; cursor: pointer; letter-spacing: 0.03em; transition: color 0.15s; }
  .nav-btn.active { color: #fff; border-bottom: 2px solid var(--clay); }

  /* VIEWS */
  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  /* DAY TABS */
  .day-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .day-tab { flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 500; border: 1.5px solid var(--ink-faint); border-radius: var(--radius-sm); background: var(--white); color: var(--ink-mid); cursor: pointer; text-align: center; transition: all 0.15s; }
  .day-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .day-tab .tab-count { display: block; font-size: 11px; font-weight: 400; margin-top: 2px; opacity: 0.7; }

  /* PROGRESS */
  .progress-wrap { background: var(--ink-faint); border-radius: 99px; height: 5px; margin-bottom: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--clay); transition: width 0.4s ease; }
  .progress-label { font-size: 12px; color: var(--ink-mid); margin-bottom: 16px; }

  /* SECTION */
  .section-head { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mid); margin: 18px 0 8px; }
  .section-head:first-of-type { margin-top: 0; }

  /* TASK CARD */
  .task { display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: opacity 0.2s; user-select: none; }
  .task.done { opacity: 0.38; }
  .task.done .task-name { text-decoration: line-through; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-faint); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .check-icon { display: none; width: 12px; height: 12px; }
  .task.done .check-icon { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; line-height: 1.35; color: var(--ink); }
  .task-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
  .badge-p0 { background: var(--clay-light); color: var(--clay-dark); }
  .badge-p1 { background: var(--amber-light); color: var(--amber); }
  .badge-p2 { background: var(--blue-light); color: var(--blue); }
  .badge-time { background: var(--ink-faint); color: var(--ink-mid); }
  .badge-type-clean { background: #E8F0FB; color: #2A5BA8; }
  .badge-type-organise { background: #E4F2EB; color: #2A7A52; }
  .badge-type-pottery { background: #FDF0DC; color: #B8710A; }
  .badge-type-stock { background: #EEE8FB; color: #4A3AA8; }
  .badge-type-garden { background: #FEF9E0; color: #92700A; }

  /* MANAGER VIEW */
  .mgr-header { font-size: 22px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
  .mgr-sub { font-size: 13px; color: var(--ink-mid); margin-bottom: 20px; }
  .day-card { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .day-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .day-card-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .day-card-pct { font-size: 13px; font-weight: 500; color: var(--ink-mid); }
  .day-card-bar-wrap { background: var(--ink-faint); border-radius: 99px; height: 6px; margin-bottom: 6px; overflow: hidden; }
  .day-card-bar { height: 100%; border-radius: 99px; background: var(--clay); transition: width 0.4s; }
  .day-card-detail { font-size: 12px; color: var(--ink-mid); }
  .day-card.all-done .day-card-bar { background: var(--green); }
  .day-card.all-done .day-card-name { color: var(--green); }

  .reset-btn { width: 100%; margin-top: 20px; padding: 13px; font-size: 14px; font-weight: 500; color: var(--ink-mid); background: none; border: 1.5px solid var(--ink-faint); border-radius: var(--radius); cursor: pointer; }
  .reset-btn:active { background: var(--ink-faint); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-mid); font-size: 14px; }
  .all-done-banner { background: var(--green-light); color: var(--green); border-radius: var(--radius); padding: 12px 16px; text-align: center; font-size: 14px; font-weight: 500; margin-bottom: 16px; display: none; }
  .all-done-banner.show { display: block; }
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-btn active" onclick="switchView('staff')">Daily checklist</button>
  <button class="nav-btn" onclick="switchView('manager')">Summary</button>
</nav>

<div id="staff-view" class="view active">
  <div class="day-tabs" id="dayTabs"></div>
  <div class="all-done-banner" id="allDoneBanner">All tasks complete for today!</div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div id="taskList"></div>
</div>

<div id="manager-view" class="view">
  <div class="mgr-header">Manager summary</div>
  <div class="mgr-sub" id="mgrDate"></div>
  <div id="mgrCards"></div>
  <button class="reset-btn" onclick="resetAll()">Reset all tasks</button>
</div>

<script>
const TASKS = [
  // TUESDAY
  {name:'Pottery delivery - pick up pottery from kiln', day:'Tue', priority:'P0', time:'', type:'Pottery delivery', freq:'Weekly', sortOrder:0},
  {name:'Front room - mop floor', day:'Tue', priority:'P1', time:'15 mins', type:'Clean', freq:'Weekly'},
  {name:'Clean tea and coffee station', day:'Tue', priority:'P0', time:'10 mins', type:'Clean', freq:'2x weekly'},
  {name:'Front room - hoover floor', day:'Tue', priority:'P0', time:'30 mins', type:'Clean', freq:'Weekly'},
  {name:'Clean windows - outside', day:'Tue', priority:'P2', time:'30 mins', type:'Clean', freq:'Monthly'},
  {name:'Clean windows - inside', day:'Tue', priority:'P2', time:'30 mins', type:'Clean', freq:'Monthly'},
  {name:'Bathroom - clean toilet', day:'Tue', priority:'P0', time:'10 mins', type:'Clean', freq:'2x weekly'},
  {name:'Bathroom - mop floor', day:'Tue', priority:'P0', time:'5 mins', type:'Clean', freq:'2x weekly'},
  {name:'Bathroom - clean sink', day:'Tue', priority:'P0', time:'5 mins', type:'Clean', freq:'2x weekly'},
  {name:'Bathroom - clean mirror', day:'Tue', priority:'P0', time:'5 mins', type:'Clean', freq:'2x weekly'},

  // WEDNESDAY
  {name:'Front shelf - clean top', day:'Wed', priority:'P0', time:'25 mins', type:'Clean', freq:'Weekly', sortOrder:1},
  {name:'Front shelf - clean acrylic lids', day:'Wed', priority:'P0', time:'20 mins', type:'Clean', freq:'Weekly', sortOrder:1},
  {name:'Front shelf - refill acrylic bottles', day:'Wed', priority:'P0', time:'20 mins', type:'Organise', freq:'Weekly', sortOrder:1},
  {name:'Front shelf - dust inside shelves', day:'Wed', priority:'P0', time:'20 mins', type:'Clean', freq:'Monthly', sortOrder:1},
  {name:'Canvas shelves - clean and dust', day:'Wed', priority:'P1', time:'15 mins', type:'Clean', freq:'Monthly'},
  {name:'Clay racks - bin old clay', day:'Wed', priority:'P1', time:'20 mins', type:'Clean', freq:'Weekly'},
  {name:'Clay racks - group + photograph', day:'Wed', priority:'P1', time:'20 mins', type:'Organise', freq:'Weekly'},
  {name:'Craft tables - sort and tidy pens', day:'Wed', priority:'P1', time:'20 mins', type:'Organise', freq:'Weekly'},
  {name:'Craft tables - sharpen pencils', day:'Wed', priority:'P1', time:'30 mins', type:'Organise', freq:'Weekly'},
  {name:'Storeroom - clean pottery paint bottles', day:'Wed', priority:'P1', time:'45 mins', type:'Clean', freq:'Weekly'},
  {name:'Storeroom - clean drying rack', day:'Wed', priority:'P1', time:'30 mins', type:'Clean', freq:'Monthly'},
  {name:'Storeroom - refill pottery paint', day:'Wed', priority:'P0', time:'45 mins', type:'Organise', freq:'Weekly'},
  {name:'Desk area - sweep floor', day:'Wed', priority:'P2', time:'10 mins', type:'Clean', freq:'Weekly'},
  {name:'Desk area - clean desktop', day:'Wed', priority:'P2', time:'10 mins', type:'Clean', freq:'Weekly'},
  {name:'Pottery postage - check emails, package and label', day:'Wed', priority:'P0', time:'30 mins', type:'Pottery delivery', freq:'Weekly', sortOrder:0},
  {name:'Pottery ready - find and email', day:'Wed', priority:'P0', time:'3 hours', type:'Pottery delivery', freq:'2x weekly', sortOrder:0},

  // FRIDAY
  {name:'Front room - sweep floor', day:'Fri', priority:'P0', time:'30 mins', type:'Clean', freq:'2x weekly'},
  {name:'Window shelves - wipe and dust', day:'Fri', priority:'P1', time:'30 mins', type:'Clean', freq:'Monthly'},
  {name:'Book shelves - clean and dust', day:'Fri', priority:'P1', time:'30 mins', type:'Clean', freq:'Monthly'},
  {name:'Clean mirror', day:'Fri', priority:'P1', time:'10 mins', type:'Clean', freq:'Monthly'},
  {name:'Front room - water plants', day:'Tue', priority:'P1', time:'10 mins', type:'Garden', freq:'Weekly'},
  {name:'Storeroom - clean sink', day:'Fri', priority:'P1', time:'10 mins', type:'Clean', freq:'Weekly'},
  {name:'Storeroom - organize info cards', day:'Fri', priority:'P2', time:'15 mins', type:'Organise', freq:'Weekly'},
  {name:'Storeroom - organise bubble wrap', day:'Fri', priority:'P2', time:'20 mins', type:'Organise', freq:'Weekly'},
  {name:'Storeroom - prep embroidery hoops', day:'Fri', priority:'P1', time:'30 mins', type:'Organise', freq:'Weekly'},
  {name:'Garage - refill the pottery cupboards', day:'Fri', priority:'P0', time:'20 mins', type:'Organise', freq:'Weekly'},
  {name:'Storeroom - organize and stamp 80 notebooks', day:'Fri', priority:'P0', time:'15 mins', type:'Organise', freq:'Weekly'},
  {name:'Bathroom - clean toilet', day:'Fri', priority:'P0', time:'10 mins', type:'Clean', freq:'2x weekly'},
  {name:'Bathroom - mop floor', day:'Fri', priority:'P0', time:'5 mins', type:'Clean', freq:'2x weekly'},
  {name:'Bathroom - clean sink', day:'Fri', priority:'P0', time:'5 mins', type:'Clean', freq:'2x weekly'},
  {name:'Bathroom - clean mirror', day:'Fri', priority:'P0', time:'5 mins', type:'Clean', freq:'2x weekly'},
  {name:'Pottery ready - find and email', day:'Fri', priority:'P0', time:'3 hours', type:'Pottery delivery', freq:'2x weekly', sortOrder:0},
  {name:'Stock count - Pottery', day:'Tue', priority:'P1', time:'15 mins', type:'Stock count', freq:'Monthly'},
  {name:'Stock count - Air dry clay', day:'Tue', priority:'P1', time:'5 mins', type:'Stock count', freq:'Monthly'},
  {name:'Stock count - Beads', day:'Tue', priority:'P1', time:'5 mins', type:'Stock count', freq:'Monthly'},
  {name:'Stock count - Anything else', day:'Tue', priority:'P1', time:'', type:'Stock count', freq:'Monthly'},
];

const DAYS = ['Tue','Wed','Thu','Fri'];
const DAY_LABELS = {Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday (catch-up)', Fri:'Friday'};

// State: checked tasks stored by "day::taskname"
let checked = JSON.parse(localStorage.getItem('shopChecked') || '{}');

let selectedDay = (()=>{
  const d = new Date().getDay();
  if (d===2) return 'Tue';
  if (d===3) return 'Wed';
  if (d===4) return 'Thu';
  if (d===5) return 'Fri';
  return 'Wed';
})();

function save() { localStorage.setItem('shopChecked', JSON.stringify(checked)); }
function key(day, name) { return day+'::'+name; }

function switchView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  event.currentTarget.classList.add('active');
  if (v==='manager') renderManager();
}

function tasksForDay(day) {
  if (day !== 'Thu') return TASKS.filter(t => t.day === day);
  // Thursday: leftover (unticked) tasks from Tuesday and Wednesday
  const leftover = [];
  ['Tue','Wed'].forEach(src => {
    TASKS.filter(t => t.day === src).forEach(t => {
      if (!checked[key(src, t.name)]) {
        leftover.push({...t, originalDay: src});
      }
    });
  });
  return leftover;
}

function typeBadgeClass(type) {
  if (type === 'Pottery delivery') return 'pottery';
  if (type === 'Stock count') return 'stock';
  return type.toLowerCase();
}

function renderTabs() {
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  DAYS.forEach(d => {
    const tasks = tasksForDay(d);
    const done = d === 'Thu'
      ? 0
      : tasks.filter(t => checked[key(d,t.name)]).length;
    const total = tasks.length;
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (d===selectedDay?' active':'');
    const countText = d === 'Thu' ? (total > 0 ? total+' left' : 'clear') : done+'/'+total;
    btn.innerHTML = `${d}<span class="tab-count">${countText}</span>`;
    btn.onclick = () => { selectedDay=d; renderStaff(); };
    el.appendChild(btn);
  });
}

function renderStaff() {
  renderTabs();
  const tasks = tasksForDay(selectedDay);
  const isThursday = selectedDay === 'Thu';

  let doneCount, pct;
  if (isThursday) {
    doneCount = 0;
    pct = tasks.length === 0 ? 100 : 0;
  } else {
    doneCount = tasks.filter(t => checked[key(selectedDay,t.name)]).length;
    pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 100;
  }

  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = isThursday
    ? (tasks.length === 0 ? 'No leftover tasks — all clear!' : tasks.length+' task'+(tasks.length>1?'s':'')+' carried over from Tue/Wed')
    : doneCount+' of '+tasks.length+' tasks done';

  const banner = document.getElementById('allDoneBanner');
  banner.classList.toggle('show', !isThursday && doneCount===tasks.length && tasks.length>0);

  const groups = {P0:[], P1:[], P2:[]};
  tasks.forEach(t => groups[t.priority].push(t));
  const typeOrder = {'Pottery delivery':0,'Clean':1,'Organise':2,'Stock count':3,'Garden':4};
  const sortGroup = arr => arr.sort((a,b) => {
    const so = (a.sortOrder??99) - (b.sortOrder??99);
    if (so !== 0) return so;
    return (typeOrder[a.type]??99) - (typeOrder[b.type]??99);
  });
  sortGroup(groups['P0']);
  sortGroup(groups['P1']);
  sortGroup(groups['P2']);

  const list = document.getElementById('taskList');
  list.innerHTML = '';

  if (isThursday && tasks.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:40px 20px;color:var(--ink-mid);font-size:14px;';
    empty.textContent = 'Nothing left over — great work!';
    list.appendChild(empty);
    return;
  }

  const pLabels = {P0:'Must do', P1:'Important', P2:'Last up'};
  ['P0','P1','P2'].forEach(p => {
    if (!groups[p].length) return;
    const sec = document.createElement('div');
    sec.className = 'section-head';
    sec.textContent = pLabels[p];
    list.appendChild(sec);
    groups[p].forEach(t => {
      // For Thursday, ticking marks the task done on its original day
      const srcDay = isThursday ? t.originalDay : selectedDay;
      const k = key(srcDay, t.name);
      const done = !!checked[k];
      const card = document.createElement('div');
      card.className = 'task'+(done?' done':'');
      const fromBadge = isThursday ? `<span class="badge" style="background:var(--ink-faint);color:var(--ink-mid)">From ${t.originalDay}</span>` : '';
      card.innerHTML = `
        <div class="check">
          <svg class="check-icon" viewBox="0 0 12 12" fill="none">
            <polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-name">${t.name}</div>
          <div class="task-meta">
            ${t.time ? `<span class="badge badge-time">${t.time}</span>` : ''}
            <span class="badge badge-type-${typeBadgeClass(t.type)}">${t.type}</span>
            ${fromBadge}
          </div>
        </div>`;
      card.onclick = () => { checked[k]=!checked[k]; save(); renderStaff(); };
      list.appendChild(card);
    });
  });
}

function renderManager() {
  const now = new Date();
  document.getElementById('mgrDate').textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const el = document.getElementById('mgrCards');
  el.innerHTML = '';
  const dayNames = {Tue:'Tuesday', Wed:'Wednesday', Fri:'Friday'};
  ['Tue','Wed','Thu','Fri'].forEach(d => {
    if (d === 'Thu') {
      const thuLeftover = tasksForDay('Thu');
      const thuCard = document.createElement('div');
      thuCard.className = 'day-card' + (thuLeftover.length === 0 ? ' all-done' : '');
      thuCard.innerHTML = `
        <div class="day-card-head">
          <div class="day-card-name">Thursday catch-up</div>
          <div class="day-card-pct">${thuLeftover.length === 0 ? '✓' : thuLeftover.length+' left'}</div>
        </div>
        <div class="day-card-bar-wrap"><div class="day-card-bar" style="width:${thuLeftover.length===0?100:0}%"></div></div>
        <div class="day-card-detail">${thuLeftover.length === 0 ? 'All tasks complete from Tue & Wed' : thuLeftover.length+' task'+(thuLeftover.length>1?'s':'')+' not yet done from Tue/Wed'}</div>`;
      el.appendChild(thuCard);
      return;
    }
    const tasks = TASKS.filter(t => t.day === d);
    const doneCount = tasks.filter(t => checked[key(d,t.name)]).length;
    const pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 0;
    const allDone = doneCount===tasks.length && tasks.length>0;
    const card = document.createElement('div');
    card.className = 'day-card'+(allDone?' all-done':'');
    card.innerHTML = `
      <div class="day-card-head">
        <div class="day-card-name">${dayNames[d]}</div>
        <div class="day-card-pct">${pct}%</div>
      </div>
      <div class="day-card-bar-wrap"><div class="day-card-bar" style="width:${pct}%"></div></div>
      <div class="day-card-detail">${doneCount} of ${tasks.length} tasks done${allDone?' · All complete!':''}</div>`;
    el.appendChild(card);
  });
}

function resetAll() {
  if (!confirm('Reset all ticked tasks? This cannot be undone.')) return;
  checked = {};
  save();
  renderStaff();
  renderManager();
}

renderStaff();
</script>
</body>
</html>
