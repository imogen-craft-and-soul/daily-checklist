<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop tasks</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --clay: #C4714A; --clay-light: #F5EBE4; --clay-dark: #8B4D2F;
    --ink: #1E1A17; --ink-mid: #6B5F57; --ink-faint: #E8E0DA;
    --white: #FDFAF8; --green: #2A7A52; --green-light: #E4F2EB;
    --amber: #B8710A; --amber-light: #FDF0DC;
    --blue-light: #E8F0FB; --blue: #2A5BA8;
    --radius: 10px; --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--white); color: var(--ink); min-height: 100vh; }

  /* LOADING SCREEN */
  #loading-screen { position: fixed; inset: 0; background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 14px; }
  #loading-screen.hidden { display: none; }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--ink-faint); border-top-color: var(--clay); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--ink-mid); }

  /* SYNC INDICATOR */
  #sync-indicator { position: fixed; bottom: 14px; right: 14px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 99px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #sync-indicator.saving { background: var(--amber-light); color: var(--amber); opacity: 1; }
  #sync-indicator.saved { background: var(--green-light); color: var(--green); opacity: 1; }
  #sync-indicator.error { background: #FAECE7; color: #993C1D; opacity: 1; }

  /* NAV */
  .nav { display: flex; background: var(--ink); position: sticky; top: 0; z-index: 100; }
  .nav-btn { flex: 1; padding: 14px 8px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5); background: none; border: none; cursor: pointer; letter-spacing: 0.03em; transition: color 0.15s; }
  .nav-btn.active { color: #fff; border-bottom: 2px solid var(--clay); }

  /* VIEWS */
  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  /* DAY TABS */
  .day-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .day-tab { flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 500; border: 1.5px solid var(--ink-faint); border-radius: var(--radius-sm); background: var(--white); color: var(--ink-mid); cursor: pointer; text-align: center; transition: all 0.15s; }
  .day-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .day-tab .tab-count { display: block; font-size: 11px; font-weight: 400; margin-top: 2px; opacity: 0.7; }

  /* PROGRESS */
  .progress-wrap { background: var(--ink-faint); border-radius: 99px; height: 5px; margin-bottom: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--clay); transition: width 0.4s ease, background 0.4s ease; }
  .progress-label { font-size: 12px; color: var(--ink-mid); margin-bottom: 16px; }

  /* SECTION */
  .section-head { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mid); margin: 18px 0 8px; }
  .section-head:first-of-type { margin-top: 0; }

  /* TASK CARD */
  .task { display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: opacity 0.2s; user-select: none; }
  .task.done { opacity: 0.38; }
  .task.done .task-name { text-decoration: line-through; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-faint); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .check-icon { display: none; width: 12px; height: 12px; }
  .task.done .check-icon { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; line-height: 1.35; color: var(--ink); }
  .task-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
  .badge-time { background: var(--ink-faint); color: var(--ink-mid); }
  .badge-type-clean { background: #E8F0FB; color: #2A5BA8; }
  .badge-type-organise { background: #E4F2EB; color: #2A7A52; }
  .badge-type-pottery { background: #FDF0DC; color: #B8710A; }
  .badge-type-stock { background: #EEE8FB; color: #4A3AA8; }
  .badge-type-garden { background: #FEF9E0; color: #92700A; }

  /* MANAGER VIEW */
  .mgr-header { font-size: 22px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
  .mgr-sub { font-size: 13px; color: var(--ink-mid); margin-bottom: 20px; }
  .day-card { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .day-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .day-card-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .day-card-pct { font-size: 13px; font-weight: 500; color: var(--ink-mid); }
  .day-card-bar-wrap { background: var(--ink-faint); border-radius: 99px; height: 6px; margin-bottom: 6px; overflow: hidden; }
  .day-card-bar { height: 100%; border-radius: 99px; background: var(--clay); transition: width 0.4s, background 0.4s; }
  .day-card-detail { font-size: 12px; color: var(--ink-mid); }
  .day-card.all-done .day-card-bar { background: var(--green); }
  .day-card.all-done .day-card-name { color: var(--green); }
  .outstanding-section { margin-top: 8px; border-top: 1px solid var(--ink-faint); padding-top: 8px; }
  .outstanding-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--clay-dark); margin-bottom: 6px; }
  .outstanding-task { font-size: 12px; color: var(--clay-dark); background: var(--clay-light); border-radius: var(--radius-sm); padding: 4px 8px; margin-bottom: 4px; }
  .crafter-summary { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .crafter-pill { font-size: 12px; background: var(--ink-faint); color: var(--ink-mid); border-radius: 99px; padding: 2px 8px; }

  .reset-btn { width: 100%; margin-top: 20px; padding: 13px; font-size: 14px; font-weight: 500; color: var(--ink-mid); background: none; border: 1.5px solid var(--ink-faint); border-radius: var(--radius); cursor: pointer; }
  .reset-btn:active { background: var(--ink-faint); }
  .all-done-banner { background: var(--green-light); color: var(--green); border-radius: var(--radius); padding: 12px 16px; text-align: center; font-size: 14px; font-weight: 500; margin-bottom: 16px; display: none; }
  .all-done-banner.show { display: block; }

  /* CRAFTER COUNTER */
  .crafter-bar { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
  .crafter-label { font-size: 13px; color: var(--ink-mid); }
  .crafter-controls { display: flex; align-items: center; gap: 12px; }
  .crafter-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink-faint); background: var(--white); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .crafter-btn:active { background: var(--ink-faint); }
  .crafter-count { font-size: 20px; font-weight: 600; color: var(--ink); min-width: 24px; text-align: center; }

  .bp-tooltip { position:fixed; background:var(--ink); color:#fff; font-size:12px; padding:8px 10px; border-radius:var(--radius-sm); pointer-events:none; z-index:9999; max-width:200px; line-height:1.5; display:none; }
  .bp-tooltip.visible { display:block; }
  .bp-slot { margin-bottom: 20px; }
  .bp-slot-hdr { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .bp-slot-hdr::after { content: ''; flex: 1; height: 0.5px; background: var(--ink-faint); }
  .bp-tables { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .bp-table { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 10px 12px; min-height: 80px; transition: border-color 0.15s; }
  .bp-table.has-booking { border-color: var(--ink-mid); }
  .bp-table.drag-over { border-color: var(--clay); background: var(--clay-light); }
  .bp-table-name { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .bp-table-name.main { color: #185FA5; }
  .bp-table-name.corner { color: #3B6D11; }
  .bp-table-name.window { color: #B8710A; }
  .bp-table-name.back { color: #534AB7; }
  .bp-group { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; padding: 5px 6px; border-radius: var(--radius-sm); cursor: grab; background: var(--ink-faint); user-select: none; }
  .bp-group:active { cursor: grabbing; }
  .bp-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .bp-dot.main { background: #378ADD; }
  .bp-dot.corner { background: #639922; }
  .bp-dot.window { background: #BA7517; }
  .bp-dot.back { background: #7F77DD; }
  .bp-dot.unassigned { background: var(--ink-mid); }
  .bp-name { font-size: 12px; color: var(--ink); line-height: 1.3; }
  .bp-count { font-size: 10px; color: var(--ink-mid); }
  .bp-pap { font-size: 10px; font-weight: 500; color: #993C1D; background: #FAECE7; padding: 1px 4px; border-radius: 3px; }
  .bp-cb { font-size: 10px; font-weight: 500; color: #185FA5; background: #E8F0FB; padding: 1px 4px; border-radius: 3px; }
  .bp-seats { font-size: 10px; color: var(--ink-mid); margin-top: 6px; padding-top: 5px; border-top: 0.5px solid var(--ink-faint); }
  .bp-empty { font-size: 12px; color: var(--ink-mid); padding: 4px 0; font-style: italic; }
  .bp-unassigned { margin-bottom: 16px; }
  .bp-unassigned-hdr { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--clay-dark); margin-bottom: 6px; }
  .bp-loading { text-align: center; padding: 40px 16px; color: var(--ink-mid); font-size: 14px; }
  .bp-summary-bar { display: flex; gap: 6px; margin-bottom: 16px; }
  .bp-stat { flex: 1; background: var(--ink-faint); border-radius: var(--radius-sm); padding: 8px 10px; }
  .bp-stat-n { font-size: 18px; font-weight: 600; color: var(--ink); }
  .bp-stat-l { font-size: 10px; color: var(--ink-mid); }
  .oc-panel { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .oc-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
  .oc-header-left { display: flex; align-items: center; gap: 10px; }
  .oc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .oc-dot.open { background: var(--green); }
  .oc-dot.close { background: var(--clay); }
  .oc-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  .oc-chevron { font-size: 12px; color: var(--ink-mid); transition: transform 0.2s; }
  .oc-panel.expanded .oc-chevron { transform: rotate(180deg); }
  .oc-body { display: none; padding: 0 16px 14px; border-top: 1px solid var(--ink-faint); }
  .oc-panel.expanded .oc-body { display: block; }
  .oc-progress-wrap { background: var(--ink-faint); border-radius: 99px; height: 5px; margin: 8px 0 4px; overflow: hidden; }
  .oc-progress-fill { height: 100%; border-radius: 99px; }
  .oc-progress-fill.open { background: var(--green); }
  .oc-progress-fill.close { background: var(--clay); }
  .oc-progress-label { font-size: 12px; color: var(--ink-mid); margin-bottom: 10px; }

  /* NOTES SECTION */
  .notes-section { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--ink-faint); }
  .notes-heading { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
  .note-block { margin-bottom: 14px; }
  .note-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 6px; }
  .note-input { width: 100%; min-height: 72px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--ink); background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); resize: none; outline: none; line-height: 1.5; }
  .note-input:focus { border-color: var(--clay); }
  .note-input::placeholder { color: #b0a8a2; }

  /* STAR RATING */
  .star-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .star-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-mid); }
  .stars { display: flex; gap: 4px; }
  .star { font-size: 26px; cursor: pointer; color: var(--ink-faint); transition: color 0.15s, transform 0.1s; line-height: 1; }
  .star.active { color: #F5C842; }
  .star:active { transform: scale(1.2); }

  /* NOTES SUMMARY */
  .notes-summary-card { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .notes-summary-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
  .notes-summary-section { margin-bottom: 12px; }
  .notes-summary-section:last-child { margin-bottom: 0; }
  .notes-summary-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 6px; }
  .notes-summary-entry { font-size: 12px; color: var(--ink); padding: 6px 10px; background: var(--white); border: 1px solid var(--ink-faint); border-radius: var(--radius-sm); margin-bottom: 5px; }
  .notes-summary-entry-day { font-size: 10px; font-weight: 600; color: var(--ink-mid); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* AI SUMMARY */
  .ai-summary-btn { width: 100%; padding: 13px; font-size: 14px; font-weight: 500; color: #fff; background: var(--ink); border: none; border-radius: var(--radius); cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ai-summary-btn:disabled { opacity: 0.5; cursor: default; }
  .ai-result { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 14px 16px; font-size: 13px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; margin-bottom: 12px; }
  .ai-result-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-mid); margin-bottom: 8px; }

  /* CONFETTI */
  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }

  /* OC WEEK PIPS */
  .oc-pip { width: 100%; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .oc-pip.done { background: var(--green-light); }
  .oc-pip.not-done { background: var(--ink-faint); }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading shop tasks…</div>
</div>

<div id="sync-indicator">Saving…</div>
<div class="bp-tooltip" id="bp-tooltip"></div>
<canvas id="confetti-canvas"></canvas>

<nav class="nav">
  <button class="nav-btn active" onclick="switchView('today')">Today</button>
  <button class="nav-btn" onclick="switchView('bookings')">Bookings</button>
  <button class="nav-btn" onclick="switchView('manager')">Summary</button>
</nav>

<div id="today-view" class="view active">
  <div id="today-content"></div>
</div>

<div id="bookings-view" class="view">
  <div id="bookings-content"></div>
</div>

<div id="staff-view" class="view">
  <div id="weekly-summary"></div>
</div>

<div id="manager-view" class="view">

</div>

// ── SUPABASE SYNC ─────────────────────────────────────────────────────────────
let saveTimer = null;

async function loadFromSupabase() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/weekly_data?id=eq.${ROW_ID}&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if (rows && rows[0]) {
      checked      = rows[0].checked      || {};
      crafters     = rows[0].crafters     || {Tue:0,Wed:0,Thu:0,Fri:0};
      notes        = rows[0].notes        || {};
      ocChecked    = rows[0].oc_checked   || {};
      customTasks  = rows[0].custom_tasks || {};
    }
  } catch(e) {
    console.error('Load error:', e);
  }
}

async function persistToSupabase() {
  showSync('saving');
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/weekly_data?id=eq.${ROW_ID}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        checked, crafters, notes, oc_checked: ocChecked,
        custom_tasks: customTasks,
        updated_at: new Date().toISOString()
      })
    });
    showSync('saved');
  } catch(e) {
    showSync('error');
  }
}

// Debounce saves — waits 800ms after last change before hitting Supabase
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistToSupabase, 800);
}

function showSync(state) {
  const el = document.getElementById('sync-indicator');
  el.className = state;
  el.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? '✓ Saved' : '⚠ Sync error';
  if (state === 'saved') setTimeout(() => { el.className = ''; }, 2000);
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function key(day, name) { return day+'::'+name; }
function ocKey(day, type, task) { return day+'::'+type+'::'+task; }

function progressColor(pct) {
  if (pct <= 50) { const g = Math.round(113 + (pct/50)*(190-113)); return `rgb(196,${g},74)`; }
  if (pct < 100) {
    const r = Math.round(196 + ((pct-50)/50)*(42-196));
    const g = Math.round(190 + ((pct-50)/50)*(122-190));
    const b = Math.round(74  + ((pct-50)/50)*(82-74));
    return `rgb(${r},${g},${b})`;
  }
  return '#2A7A52';
}

function typeBadgeClass(type) {
  if (type==='Pottery delivery') return 'pottery';
  if (type==='Stock count') return 'stock';
  return type.toLowerCase();
}

function isOcComplete(day, type) {
  return OC_TASKS[type].every(t => ocChecked[ocKey(day, type, t)]);
}

function tasksForDay(day) {
  if (!CATCHUP_DAYS.has(day)) return TASKS.filter(t => t.day === day);
  const sources = CATCHUP_SOURCES[day] || [];
  const leftover = [];
  sources.forEach(src => {
    TASKS.filter(t => t.day === src).forEach(t => {
      if (!checked[key(src, t.name)]) leftover.push({...t, originalDay: src});
    });
  });
  return leftover;
}

// ── NOTES & RATINGS ───────────────────────────────────────────────────────────
function saveNote(field) {
  if (!notes[selectedDay]) notes[selectedDay] = {};
  notes[selectedDay][field] = document.getElementById('note-'+field).value;
  save();
}

function loadNotes(day) {
  const n = notes[day] || {};
  document.getElementById('note-well').value = n.well || '';
  document.getElementById('note-improve').value = n.improve || '';
  document.getElementById('note-ideas').value = n.ideas || '';
  renderStars(n.rating || 0);
}

function renderStars(rating) {
  document.querySelectorAll('#starRating .star').forEach((s,i) => s.classList.toggle('active', i < rating));
}

function setRating(val) {
  if (!notes[selectedDay]) notes[selectedDay] = {};
  notes[selectedDay].rating = notes[selectedDay].rating === val ? 0 : val;
  renderStars(notes[selectedDay].rating);
  save();
}

// ── CRAFTERS ──────────────────────────────────────────────────────────────────
function addCustomTask(day, name, priority) {
  if (!name.trim()) return;
  if (!customTasks[day]) customTasks[day] = [];
  customTasks[day].push({ id: Date.now().toString(), name: name.trim(), priority, done: false });
  save();
  renderToday();
}

function toggleCustomTask(day, id) {
  const t = (customTasks[day]||[]).find(t => t.id === id);
  if (t) { t.done = !t.done; save(); renderToday(); }
}

function deleteCustomTask(day, id) {
  customTasks[day] = (customTasks[day]||[]).filter(t => t.id !== id);
  save();
  renderToday();
}

function changeCrafters(delta) {
  crafters[selectedDay] = Math.max(0, (crafters[selectedDay] || 0) + delta);
  save();
  const el = document.getElementById('crafterCount');
  if (el) el.textContent = crafters[selectedDay];
}

function changeWater(delta) {
  const k = selectedDay+'_water';
  const prev = crafters[k] || 0;
  crafters[k] = Math.max(0, prev + delta);
  save();
  const el = document.getElementById('waterCount');
  if (el) el.textContent = crafters[k];
  // Confetti at 4 cups
  if (crafters[k] === 6 && prev < 6) launchConfetti();
  // Update the overview row text
  renderToday();
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function switchView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  event.currentTarget.classList.add('active');
  if (v==='manager') { renderManager(); }
  if (v==='today') { renderToday(); }
  if (v==='staff') { renderWeeklySummary(); }
  if (v==='bookings') { renderBookings(); }
}

  }

  // Helper: build task section
  function buildTaskSection() {
    const tasks = tasksForDay(selectedDay);
    const isCatchupDay = CATCHUP_DAYS.has(selectedDay);
    const doneCount = isCatchupDay ? 0 : tasks.filter(t => checked[key(t.originalDay||selectedDay, t.name)]).length;
    const pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 100;

    const groups = {P0:[],P1:[],P2:[]};
    tasks.forEach(t => groups[t.priority].push(t));
    const typeOrder = {'Pottery delivery':0,'Clean':1,'Organise':2,'Stock count':3,'Garden':4};
    const sortGroup = arr => arr.sort((a,b)=>{const s=(a.sortOrder??99)-(b.sortOrder??99);return s!==0?s:(typeOrder[a.type]??99)-(typeOrder[b.type]??99);});

      </div>

        <div style="font-size:11px;color:var(--ink-mid);margin-bottom:10px;" id="today-prog-lbl">${doneCount} of ${tasks.length} tasks done</div>

    el.appendChild(wrap);

    const list = wrap.querySelector('#today-task-list');

        list.appendChild(sec);

          card.innerHTML = `<div class="check"><svg class="check-icon" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="task-body"><div class="task-name">${t.name}</div><div class="task-meta">${t.time?`<span class="badge badge-time">${t.time}</span>`:''}<span class="badge badge-type-${typeBadgeClass(t.type)}">${t.type}</span></div></div>`;
          card.onclick = () => { checked[k2]=!checked[k2]; save(); renderToday(); renderStaff(); };
          list.appendChild(card);
        });
      });
    }
    // Custom tasks for this day
    const dayCustom = customTasks[selectedDay] || [];
    const pLabels2 = {P0:'Must do', P1:'Important', P2:'Last up'};
    const pColors  = {P0:'var(--clay)', P1:'var(--amber)', P2:'var(--blue)'};

    if (dayCustom.length > 0) {
      ['P0','P1','P2'].forEach(p => {
        const group = dayCustom.filter(t => t.priority === p);
        if (!group.length) return;
        const sec = document.createElement('div');
        sec.className = 'section-head';
        sec.textContent = pLabels2[p] + ' (added)';
        list.appendChild(sec);
        group.forEach(t => {
          const card = document.createElement('div');
          card.className = 'task' + (t.done ? ' done' : '');
          card.style.cssText = 'position:relative;';
          const delBtn = document.createElement('button');
          delBtn.style.cssText = 'position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;color:var(--ink-mid);cursor:pointer;padding:4px;line-height:1;';
          delBtn.textContent = '×';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteCustomTask(selectedDay, t.id); };
          card.innerHTML = `<div class="check"><svg class="check-icon" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="task-body"><div class="task-name">${t.name}</div></div>`;

          card.onclick = () => toggleCustomTask(selectedDay, t.id);
          list.appendChild(card);
        });

    // Add task UI
    const addEl = document.createElement('div');
    addEl.style.cssText = 'margin-top:10px;padding-top:10px;border-top:1px dashed var(--ink-faint);';

    const addLabel = document.createElement('div');
    addLabel.style.cssText = 'font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:8px;';
    addLabel.textContent = '+ Add a task';

    const input = document.createElement('input');
    input.id = 'custom-task-input';
    input.type = 'text';
    input.placeholder = 'Task name…';
    input.style.cssText = 'width:100%;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--ink-faint);border-radius:var(--radius);outline:none;margin-bottom:7px;box-sizing:border-box;';

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:6px;';

    const priorities = [{p:'P0',label:'Must do',color:'var(--clay)'},{p:'P1',label:'Important',color:'var(--amber)'},{p:'P2',label:'Last up',color:'var(--blue)'}];
    priorities.forEach(({p, label, color}) => {
      const btn = document.createElement('button');
      btn.style.cssText = `flex:1;padding:7px 4px;font-size:11px;font-weight:500;border:1.5px solid ${color};border-radius:var(--radius-sm);background:#fff;color:${color};cursor:pointer;`;
      btn.textContent = label;
      btn.onclick = () => addCustomTask(selectedDay, input.value, p);
      btnRow.appendChild(btn);
    });

    addEl.appendChild(addLabel);
    addEl.appendChild(input);
    addEl.appendChild(btnRow);
    wrap.querySelector('#today-task-inner').appendChild(addEl);
  }
  function buildNotesSection() {
    const n = notes[selectedDay] || {};
    const hasNotes = n.well || n.improve || n.ideas || n.rating;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'background:#fff;border:1px solid var(--ink-faint);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;';

    const starsHTML = `<div style="display:flex;gap:3px;">${[1,2,3,4,5].map(i=>`<span onclick="setRatingToday(${i})" style="font-size:22px;cursor:pointer;color:${(n.rating||0)>=i?'#F5C842':'var(--ink-faint)'};">★</span>`).join('')}</div>`;

    wrap.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--ink-faint);" onclick="toggleTodayNotes(this)">
        <div style="font-size:14px;font-weight:500;color:var(--ink);">Notes</div>
        <span style="font-size:11px;color:var(--ink-mid);" class="notes-chev">▼</span>
      </div>
      <div id="today-notes-inner" style="padding:12px 14px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
          <div style="font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-mid);">Rate the day</div>
          ${starsHTML}
        </div>
        <div style="margin-bottom:10px;"><div style="font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:5px;">What went well</div><textarea style="width:100%;min-height:60px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--ink-faint);border-radius:var(--radius);resize:none;outline:none;line-height:1.5;" placeholder="Add notes here…" oninput="saveTodayNote('well',this.value)">${n.well||''}</textarea></div>
        <div style="margin-bottom:10px;"><div style="font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:5px;">What could be improved</div><textarea style="width:100%;min-height:60px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--ink-faint);border-radius:var(--radius);resize:none;outline:none;line-height:1.5;" placeholder="Add notes here…" oninput="saveTodayNote('improve',this.value)">${n.improve||''}</textarea></div>
        <div><div style="font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:5px;">Ideas and shopping list</div><textarea style="width:100%;min-height:60px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--ink-faint);border-radius:var(--radius);resize:none;outline:none;line-height:1.5;" placeholder="Add notes here…" oninput="saveTodayNote('ideas',this.value)">${n.ideas||''}</textarea></div>
      </div>`;
    el.appendChild(wrap);
  }

  // Build the page in order
  buildOcSection('opening', 'Opening checklist', 'open', 'var(--green)');
  buildTaskSection();
  buildOcSection('closing', 'Closing checklist', 'close', 'var(--clay)');
  buildNotesSection();
}

function toggleTodayTasks(hdr) {
  const inner = document.getElementById('today-task-inner');
  const chev = hdr.querySelector('.tasks-chev');
  inner.style.display = inner.style.display === 'none' ? 'block' : 'none';
  chev.style.transform = inner.style.display === 'none' ? '' : 'rotate(180deg)';
}

function toggleTodayNotes(hdr) {
  const inner = document.getElementById('today-notes-inner');
  const chev = hdr.querySelector('.notes-chev');
  inner.style.display = inner.style.display === 'none' ? 'block' : 'none';
  chev.style.transform = inner.style.display === 'none' ? '' : 'rotate(180deg)';
}

function saveTodayNote(field, val) {
  if (!notes[selectedDay]) notes[selectedDay] = {};
  notes[selectedDay][field] = val;
  // Keep the staff view notes inputs in sync
  const staffInput = document.getElementById('note-'+field);
  if (staffInput) staffInput.value = val;
  save();
}

function setRatingToday(val) {
  if (!notes[selectedDay]) notes[selectedDay] = {};
  notes[selectedDay].rating = notes[selectedDay].rating === val ? 0 : val;
  renderStars(notes[selectedDay].rating);
  save();
  renderToday();
}

// ── RENDER: WEEKLY SUMMARY (Week tab) ──────────────────────────────────────────
function renderWeeklySummary() {
  const el = document.getElementById('weekly-summary');
  if (!el) return;
  el.innerHTML = '';

  const typeOrder = {'Pottery delivery':0,'Clean':1,'Organise':2,'Stock count':3,'Garden':4};
  const sortGroup = arr => arr.sort((a,b) => {
    const s = (a.sortOrder??99)-(b.sortOrder??99);
    return s!==0 ? s : (typeOrder[a.type]??99)-(typeOrder[b.type]??99);
  });
  const pLabels = {P0:'Must do', P1:'Important', P2:'Last up'};
  const dayNames = {Tue:'Tuesday', Wed:'Wednesday', Fri:'Friday'};

  // Type colours matching badge classes
  const typeColors = {
    'Pottery delivery': {bg:'#FDF0DC', color:'#B8710A'},
    'Clean':            {bg:'#E8F0FB', color:'#2A5BA8'},
    'Organise':         {bg:'#E4F2EB', color:'#2A7A52'},
    'Stock count':      {bg:'#EEE8FB', color:'#4A3AA8'},
    'Garden':           {bg:'#FEF9E0', color:'#92700A'},
  };

  // Day cards — only scheduled task days (not catch-up days)
  ['Tue','Wed','Fri'].forEach(d => {
    const tasks = TASKS.filter(t => t.day === d);
    const doneCount = tasks.filter(t => checked[key(d, t.name)]).length;
    const pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 0;

    // Per-day type counts
    const dayTypeCounts = {};
    tasks.forEach(t => { dayTypeCounts[t.type] = (dayTypeCounts[t.type]||0) + 1; });
    const dayTypePills = Object.entries(dayTypeCounts)
      .sort((a,b) => (typeOrder[a[0]]??99)-(typeOrder[b[0]]??99))
      .map(([type, count]) => {
        const c = typeColors[type] || {bg:'var(--ink-faint)', color:'var(--ink-mid)'};
        return `<span style="font-size:10px;font-weight:500;padding:2px 6px;border-radius:99px;background:${c.bg};color:${c.color};">${count} ${type}</span>`;
      }).join('');

    const card = document.createElement('div');
    card.style.cssText = 'background:#fff;border:1px solid var(--ink-faint);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;';

    const hdr = document.createElement('div');
    hdr.style.cssText = 'padding:12px 14px;cursor:pointer;';
    hdr.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
        <div style="font-size:14px;font-weight:500;color:${pct===100?'var(--green)':'var(--ink)'};">${dayNames[d]}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-size:12px;color:var(--ink-mid);">${doneCount}/${tasks.length}</div>
          <span style="font-size:11px;color:var(--ink-mid);transition:transform 0.2s;" data-chev>▶</span>
        </div>
      </div>
      <div style="background:var(--ink-faint);border-radius:99px;height:3px;overflow:hidden;margin-bottom:8px;">
        <div style="height:100%;border-radius:99px;background:${progressColor(pct)};width:${pct}%;"></div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">${dayTypePills}</div>`;
    card.appendChild(hdr);

    // Body — collapsed by default
    const body = document.createElement('div');
    body.style.cssText = 'display:none;padding:4px 14px 12px;border-top:1px solid var(--ink-faint);';

    const groups = {P0:[], P1:[], P2:[]};
    tasks.forEach(t => groups[t.priority].push(t));
    ['P0','P1','P2'].forEach(p => sortGroup(groups[p]));

    ['P0','P1','P2'].forEach(p => {
      if (!groups[p].length) return;
      const secHead = document.createElement('div');
      secHead.className = 'section-head';
      secHead.textContent = pLabels[p];
      body.appendChild(secHead);
      groups[p].forEach(t => {
        const isDone = !!checked[key(d, t.name)];
        const row = document.createElement('div');
        row.style.cssText = 'padding:5px 0;border-bottom:0.5px solid var(--ink-faint);';
        row.innerHTML = `<div style="font-size:13px;color:${isDone?'var(--ink-mid)':'var(--ink)'};${isDone?'text-decoration:line-through;':''}">${t.name}</div>`;
        body.appendChild(row);
      });
    });

    card.appendChild(body);

    // Toggle
    hdr.addEventListener('click', () => {
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      hdr.querySelector('[data-chev]').style.transform = open ? '' : 'rotate(90deg)';
    });

    el.appendChild(card);
  });
}

// Keep renderStaff as an alias that re-renders both Today and Weekly Summary
function renderStaff() {
  renderWeeklySummary();
  if (document.getElementById('today-view').classList.contains('active')) {
    renderToday();
  }
}

// ── RENDER: MANAGER VIEW ──────────────────────────────────────────────────────
function renderManager() {
  document.getElementById('mgrDate').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('mgrOcWeek').innerHTML = '';

  const el = document.getElementById('mgrCards');
  el.innerHTML = '';

  const noteFields = [{key:'well',label:'What went well'},{key:'improve',label:'What could be improved'},{key:'ideas',label:'Ideas & shopping list'}];
  const todayWd = new Date().getDay(); // 0=Sun,1=Mon...
  const dayToWd = {Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0};
  const dayLabels = {Tue:'Tue',Wed:'Wed',Thu:'Thu',Fri:'Fri',Sat:'Sat',Sun:'Sun'};

  // ── 3-col day grid ──────────────────────────────────────────────────────
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px;';

  ['Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
    const wd = dayToWd[d];
    const isPast = wd < todayWd || (wd === 0 && todayWd > 0);
    const isToday = wd === todayWd;
    const hasData = isPast || isToday;

    const isCatchup = CATCHUP_DAYS.has(d);
    const crafterCount = crafters[d] || 0;
    const rating = (notes[d]||{}).rating || 0;

    let smooth = false, hasIssues = false;

    if (!isCatchup && hasData) {
      const tasks = TASKS.filter(t => t.day === d);
      const p0Tasks = tasks.filter(t => t.priority === 'P0');
      const doneCount = tasks.filter(t => checked[key(d,t.name)]).length;
      const p0Done = p0Tasks.filter(t => checked[key(d,t.name)]).length;
      const pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 0;
      const allMusts = p0Done === p0Tasks.length;
      const ocOpen = isOcComplete(d,'opening');
      const ocClose = isOcComplete(d,'closing');
      smooth = ocOpen && ocClose && allMusts && pct >= 80;
      hasIssues = !ocOpen || !ocClose || !allMusts;

      const outstanding = p0Tasks.filter(t => !checked[key(d,t.name)]);

      let borderColor = hasData ? (smooth ? '#1D9E75' : hasIssues ? '#D85A30' : 'var(--amber)') : 'var(--ink-faint)';
      let emoji = !hasData ? '—' : smooth ? '✨' : hasIssues ? '⚠️' : '🙂';
      let dotBg = !hasData ? 'var(--ink-faint)' : smooth ? '#E1F5EE' : hasIssues ? '#FAECE7' : '#FAEEDA';

      const card = document.createElement('div');
      card.style.cssText = `background:#fff;border:${hasData?'1.5px':'0.5px'} solid ${borderColor};border-radius:var(--radius);padding:10px 8px;text-align:center;${!hasData?'opacity:0.35;':''}`;

      card.innerHTML = `
        <div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:7px;">${dayLabels[d]}</div>
        <div style="width:34px;height:34px;border-radius:50%;background:${dotBg};display:flex;align-items:center;justify-content:center;font-size:15px;margin:0 auto 7px;">${emoji}</div>
        ${rating ? `<div style="color:#F5C842;font-size:11px;letter-spacing:-1px;margin-bottom:5px;">${'★'.repeat(rating)}${'☆'.repeat(5-rating)}</div>` : `<div style="margin-bottom:5px;height:16px;"></div>`}
        <div style="display:flex;justify-content:center;gap:3px;flex-wrap:wrap;margin-bottom:5px;">
          <span style="font-size:9px;font-weight:500;padding:1px 4px;border-radius:3px;background:${ocOpen?'#E1F5EE':'#FAECE7'};color:${ocOpen?'#0F6E56':'#993C1D'};">${ocOpen?'✓':'✗'} Open</span>
          <span style="font-size:9px;font-weight:500;padding:1px 4px;border-radius:3px;background:${ocClose?'#E1F5EE':'#FAECE7'};color:${ocClose?'#0F6E56':'#993C1D'};">${ocClose?'✓':'✗'} Close</span>
        </div>
        <div style="display:flex;justify-content:center;gap:3px;flex-wrap:wrap;margin-bottom:6px;">
          <span style="font-size:9px;font-weight:500;padding:1px 4px;border-radius:3px;background:${allMusts?'#E1F5EE':'#FAECE7'};color:${allMusts?'#0F6E56':'#993C1D'};">${allMusts?'✓ Must-dos':'✗ '+outstanding.length+' missed'}</span>

async function archiveWeek() {
  const btn = event.currentTarget;
  btn.disabled = true;
  btn.textContent = 'Archiving…';

  // week_ending = most recent Friday
  const today = new Date();
  const day = today.getDay();
  const diff = day <= 5 ? (day === 0 ? 6 : day - 5 + 7) % 7 : 0;
  const friday = new Date(today);
  friday.setDate(today.getDate() - (day === 5 ? 0 : (day < 5 ? day + 2 : day - 5)));
  const weekEnding = friday.toISOString().split('T')[0];

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/weekly_archive`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        week_ending: weekEnding,
        checked, crafters, notes, oc_checked: ocChecked
      })
    });
    if (res.ok) {
      btn.textContent = '✓ Archived!';

}

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colours = ['#C4714A','#2A7A52','#B8710A','#2A5BA8','#9F4AB0','#E05B8C','#F5C842'];
  const pieces = Array.from({length:120},()=>({
    x:Math.random()*canvas.width, y:Math.random()*-canvas.height,
    w:6+Math.random()*8, h:10+Math.random()*6,
    color:colours[Math.floor(Math.random()*colours.length)],
    rot:Math.random()*360, rotSpeed:(Math.random()-0.5)*6,
    vx:(Math.random()-0.5)*3, vy:3+Math.random()*4, opacity:1,
  }));
  let frame, elapsed=0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height); elapsed++;
    let alive=false;
    pieces.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotSpeed;
      if (elapsed>80) p.opacity=Math.max(0,p.opacity-0.015);
      if (p.y<canvas.height+20) alive=true;
      ctx.save(); ctx.globalAlpha=p.opacity; ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (alive) frame=requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  if (frame) cancelAnimationFrame(frame); draw();
}

function parseBookings(events) {
  const sessionEvents = events.filter(e => {
    const s = e.summary || '';
    if (s.startsWith('[CB]')) return false;
    return true;
  });
  const groupMap = {};
  sessionEvents.forEach(e => {
    const raw = e.summary || '';
    const nameMatch = raw.match(/^(.+?):/);
    if (!nameMatch) return;
    let name = nameMatch[1].trim();
    const isPAP = /PAP/i.test(name) || /paint.a.pot/i.test(raw);
    const isCB = /class.?bento/i.test(name) || /classbento/i.test(e.creator?.email||'');
    const typeMatch = raw.match(/\(([^)]+)\)$/);
    const sessionType = typeMatch ? typeMatch[1] : '';
    const isClass = sessionType === 'Classes' || /watercolour|clay|embroidery/i.test(raw);
    name = name.replace(/\s*PAP\s*/gi,'').replace(/\s*Class\s*Bento\s*/gi,'').replace(/\s*CLAY\s*/gi,'').trim();
    const startTime = e.start?.dateTime || '';
    const endTime = e.end?.dateTime || '';
    const gKey = name + '|' + startTime;
    if (!groupMap[gKey]) {
      groupMap[gKey] = {name, startTime, endTime, count:0, isPAP, isCB, isClass, sessionType, key:gKey};
    }
    groupMap[gKey].count++;
  });
  return Object.values(groupMap).sort((a,b) => a.startTime.localeCompare(b.startTime));
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  const hh = h % 12 || 12;
  return `${hh}${m ? ':'+String(m).padStart(2,'0') : ''} ${ampm}`;
}

function formatDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}

function slotKey(group) { return group.startTime+'|'+group.endTime; }
function getAssignment(slotK, groupKey) { return (tableAssignments[slotK]||{})[groupKey]||null; }
function setAssignment(slotK, groupKey, tableId) {
  if (!tableAssignments[slotK]) tableAssignments[slotK] = {};
  if (tableId===null) delete tableAssignments[slotK][groupKey];
  else tableAssignments[slotK][groupKey] = tableId;
}

function autoAssign(groups) {
  const T = [
    {id:'main',   seats:10, shareable:true},
    {id:'corner', seats:6,  shareable:true},
    {id:'window', seats:6,  shareable:true},
    {id:'back',   seats:10, shareable:false},
  ];
  const SPLIT_PAIRS = [['main','corner'],['corner','window']];

  const slots = {};
  groups.forEach(g => { const sk=slotKey(g); if(!slots[sk]) slots[sk]=[]; slots[sk].push(g); });

  Object.entries(slots).forEach(([sk, slotGroups]) => {
    const usage = {};
    T.forEach(t => { usage[t.id] = 0; });

    // Carry over existing manual assignments
    Object.entries(tableAssignments[sk]||{}).forEach(([gk, tid]) => {
      if (gk.endsWith('__split')) return;
      const g = slotGroups.find(g => g.key === gk || g.key.replace(/["|]/g,'_') === gk);
      if (g) usage[tid] = (usage[tid]||0) + g.count;
    });

    // Sort groups largest first so big groups get first pick
    const unassigned = slotGroups.filter(g => !getAssignment(sk, g.key))
      .sort((a,b) => b.count - a.count);

    unassigned.forEach(g => {
      // Large group: try split pair
      if (g.count > 12) {
        const pair = SPLIT_PAIRS.find(([a,b]) => {
          const ta=T.find(t=>t.id===a), tb=T.find(t=>t.id===b);
          return usage[a]===0 && usage[b]===0 && g.count <= ta.seats+tb.seats;
        });
        if (pair) {
          setAssignment(sk, g.key, pair[0]);
          if (!tableAssignments[sk]) tableAssignments[sk]={};
          tableAssignments[sk][g.key+'__split'] = pair[1];
          const ta=T.find(t=>t.id===pair[0]);
          const seatsOnA = Math.min(g.count, ta.seats);
          usage[pair[0]] += seatsOnA;
          usage[pair[1]] += g.count - seatsOnA;
          return;
        }
      }

      // Find the emptiest table that fits (prefer completely empty tables)
      const fits = T.filter(t => t.seats - usage[t.id] >= g.count);
      if (fits.length) {
        // Among tables that fit, pick the one with least usage (most empty)
        const best = fits.reduce((a,b) => usage[a.id] <= usage[b.id] ? a : b);
        setAssignment(sk, g.key, best.id);
        usage[best.id] += g.count;
      } else {
        // Overflow: pick table with most remaining space
        const best = T.reduce((a,b) => (b.seats-usage[b.id]) > (a.seats-usage[a.id]) ? b : a);
        setAssignment(sk, g.key, best.id);
        usage[best.id] += g.count;
      }
    });
  });
}

function renderBookingPlan(groups) {

    {id:'window', label:'Window', seats:6,  c:'window'},

  const COLORS = {
    main:   {bg:'#B5D4F4', border:'#378ADD', text:'#0C447C'},
    corner: {bg:'#C0DD97', border:'#639922', text:'#27500A'},
    window: {bg:'#FAC775', border:'#BA7517', text:'#633806'},
    back:   {bg:'#CECBF6', border:'#534AB7', text:'#26215C'},
  };
  const SHADES = {
    main:   ['#B5D4F4','#85B7EB','#C8E2F8','#6BA3D9'],
    corner: ['#C0DD97','#97C459','#D4EBB0','#7AAE3C'],
    window: ['#FAC775','#EF9F27','#FCD89A','#D4880F'],
    back:   ['#CECBF6','#AFA9EC','#E0DEFA','#9088D4'],

  const SLOTS = [];
  for (let h=10; h<=21; h++) for (let m of [0,30]) {
    if (h===10&&m===0) continue;
    if (h===21&&m===30) continue;
    SLOTS.push(h*60+m);
  }
  function fmtT(mins) {
    const h=Math.floor(mins/60),m=mins%60;
    const ampm=h>=12?'pm':'am';
    return `${h%12||12}${m?':'+String(m).padStart(2,'0'):''}${ampm}`;
  }
  function toMins(iso) { if(!iso) return 0; const d=new Date(iso); return d.getHours()*60+d.getMinutes(); }

  const today = new Date();
  const dateStr = today.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});

  dHdr.style.cssText = 'font-size:15px;font-weight:500;color:var(--ink);margin-bottom:14px;padding-bottom:8px;border-bottom:1.5px solid var(--clay);';
  dHdr.textContent = dateStr;
  el.appendChild(dHdr);

  if (!groups || !groups.length) {

    btns.innerHTML=`<button class="reset-btn" style="flex:1;" onclick="tableAssignments={};fetchAndRenderBookings();">Refresh</button><button class="reset-btn" style="flex:1;" onclick="gcalToken=null;localStorage.removeItem('gcal_token');renderBookings();">Sign out</button>`;
    el.appendChild(btns);

  }

  // ── GROUP LIST ────────────────────────────────────────────────────────────
  const totalCrafters = groups.reduce((s,g)=>s+g.count,0);

  const summaryEl = document.createElement('div');
  summaryEl.style.cssText = 'display:flex;gap:6px;margin-bottom:12px;';
  summaryEl.innerHTML = `
    <div class="bp-stat"><div class="bp-stat-n">${groups.length}</div><div class="bp-stat-l">Groups</div></div>
    <div class="bp-stat"><div class="bp-stat-n">${totalCrafters}</div><div class="bp-stat-l">Crafters</div></div>`;
  el.appendChild(summaryEl);

  // Sort groups chronologically
  const sortedGroups = [...groups].sort((a,b) => a.startTime.localeCompare(b.startTime));

  sortedGroups.forEach(g => {
    const startM = toMins(g.startTime);
    const endM = startM + 150;
    const sk = slotKey(g);
    const tableId = getAssignment(sk, g.key);
    const tDef = T_DEF.find(t=>t.id===tableId);
    const tColor = tDef ? COLORS[tDef.c] : null;

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--ink-faint);';

    timeEl.textContent = `${fmtT(startM)} – ${fmtT(endM)}`;

    // Colour dot for table

    dot.style.cssText = `width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${tColor?tColor.border:'var(--ink-faint)'};`;

    // Name + details

    info.style.cssText = 'flex:1;min-width:0;';

    name.style.cssText = 'font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
    name.textContent = g.name;
    const meta = document.createElement('div');
    meta.style.cssText = 'display:flex;gap:4px;align-items:center;margin-top:2px;';
    meta.innerHTML = `<span style="font-size:11px;color:var(--ink-mid);">👥 ${g.count} ${g.count===1?'person':'people'}</span>
      ${g.isPAP?'<span style="font-size:10px;font-weight:500;color:#712B13;background:#F5C4B3;padding:1px 4px;border-radius:3px;">PAP</span>':''}
      ${g.isCB?'<span style="font-size:10px;font-weight:500;color:#0C447C;background:#B5D4F4;padding:1px 4px;border-radius:3px;">CB</span>':''}

  el.appendChild(tlHdr);

  // Build bkgs for today only
  const bkgs = groups.map(g => {
    const sk = slotKey(g);
    const tableId = getAssignment(sk, g.key);
    const splitId = (tableAssignments[sk]||{})[g.key+'__split'] || null;
    const startM = toMins(g.startTime);
    const endM = startM + 150;
    const tDef = T_DEF.find(t=>t.id===tableId);
    const seatsOnMain = splitId && tDef ? Math.min(g.count, tDef.seats) : g.count;
    const seatsOnSplit = splitId ? g.count - seatsOnMain : 0;
    return {g, tableId, splitId, startM, endM, seatsOnMain, seatsOnSplit, sk};
  });

  // Assign shade indices per table
  const tableGroupIndex = {};
  bkgs.forEach(b => {
    if (b.tableId) {
      if (tableGroupIndex[b.tableId]===undefined) tableGroupIndex[b.tableId]=0;
      b.shadeIdx = tableGroupIndex[b.tableId]++;
    }
    if (b.splitId) {
      if (tableGroupIndex[b.splitId]===undefined) tableGroupIndex[b.splitId]=0;
      b.shadeIdxSplit = tableGroupIndex[b.splitId]++;
    }
  });

  const tableWrap = document.createElement('div');
  tableWrap.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;border:0.5px solid var(--ink-faint);border-radius:var(--radius);margin-bottom:16px;';

  const tbl = document.createElement('table');
  tbl.style.cssText = 'width:100%;border-collapse:collapse;table-layout:fixed;';

  const cg = document.createElement('colgroup');

  T_DEF.forEach((t,i) => {
    if (i>0) cg.innerHTML += `<col style="width:2px;">`;
    for (let s=0;s<t.seats;s++) cg.innerHTML += `<col style="width:16px;">`;
  });
  tbl.appendChild(cg);

  const thead = document.createElement('thead');
  let h1='<tr><th style="border-bottom:0.5px solid var(--ink-faint);"></th>';
  let h2='<tr><th></th>';
  T_DEF.forEach((t,i) => {
    const c=COLORS[t.c];
    if (i>0) { h1+=`<th style="background:var(--ink-faint);width:2px;border:none;padding:0;"></th>`; h2+=`<th style="background:var(--ink-faint);padding:0;border-bottom:1.5px solid var(--ink-faint);"></th>`; }
    h1+=`<th colspan="${t.seats}" style="padding:5px 3px 4px;text-align:center;font-size:11px;font-weight:500;color:${c.text};background:${c.bg};border-bottom:0.5px solid ${c.border};">${t.label}<span style="display:block;font-size:9px;font-weight:400;opacity:0.7;">${t.seats} seats</span></th>`;
    for (let s=1;s<=t.seats;s++) h2+=`<th style="font-size:8px;font-weight:400;color:${c.text};text-align:center;padding:2px 0 4px;border-bottom:1.5px solid ${c.border};opacity:0.7;">${s}</th>`;
  });
  h1+='</tr>'; h2+='</tr>';
  thead.innerHTML = h1+h2;
  tbl.appendChild(thead);

  const tbody = document.createElement('tbody');
  SLOTS.forEach(slotMin => {
    const isHour = slotMin%60===0;
    const tr = document.createElement('tr');
    if (!isHour) tr.style.opacity='0.55';

    const timeTd = document.createElement('td');
    timeTd.style.cssText=`font-size:${isHour?'10':'9'}px;font-weight:${isHour?'500':'400'};color:var(--ink-mid);text-align:right;padding:0 4px;border-bottom:0.5px solid var(--ink-faint);border-right:0.5px solid var(--ink-faint);vertical-align:middle;white-space:nowrap;height:20px;`;
    timeTd.textContent = fmtT(slotMin);
    tr.appendChild(timeTd);

    T_DEF.forEach((t,ti) => {
      const c=COLORS[t.c];
      if (ti>0) { const g=document.createElement('td'); g.style.cssText='background:var(--ink-faint);padding:0;width:2px;border-bottom:0.5px solid var(--ink-faint);'; tr.appendChild(g); }

      const activeBkgs = bkgs.filter(b => (b.tableId===t.id||b.splitId===t.id) && slotMin>=b.startM && slotMin<b.endM);

      for (let s=0; s<t.seats; s++) {
        const td = document.createElement('td');
        td.style.cssText='padding:1px 1px;border-bottom:0.5px solid var(--ink-faint);height:20px;vertical-align:top;';

        let occupiedBy=null, seatsCounted=0;
        for (const bk of activeBkgs) {
          const seatsHere = bk.tableId===t.id ? bk.seatsOnMain : bk.seatsOnSplit;
          if (s>=seatsCounted && s<seatsCounted+seatsHere) { occupiedBy=bk; break; }
          seatsCounted+=seatsHere;
        }

        if (occupiedBy) {
          const isFirst=slotMin===occupiedBy.startM, isLast=slotMin+30>=occupiedBy.endM;
          const shape=isFirst&&isLast?'both':isFirst?'top':isLast?'bot':'mid';
          const onMain=occupiedBy.tableId===t.id;
          const shadeIdx=onMain?(occupiedBy.shadeIdx||0):(occupiedBy.shadeIdxSplit||0);
          const bg=(SHADES[t.c]||SHADES.main)[shadeIdx%4];
          const border=c.border;

          const div=document.createElement('div');
          div.style.cssText=`width:100%;height:18px;background:${bg};${shape==='top'||shape==='both'?`border-top:1.5px solid ${border};`:''}${shape==='bot'||shape==='both'?`border-bottom:1.5px solid ${border};`:''}${shape==='top'?'border-radius:3px 3px 0 0;':''}${shape==='bot'?'border-radius:0 0 3px 3px;':''}${shape==='both'?'border-radius:3px;':''}`;

          const seatsBeforeThis=activeBkgs.slice(0,activeBkgs.indexOf(occupiedBy)).reduce((sum,b)=>sum+(b.tableId===t.id?b.seatsOnMain:b.seatsOnSplit),0);
          if (isFirst && s===seatsBeforeThis) {
            const seatsHere=onMain?occupiedBy.seatsOnMain:occupiedBy.seatsOnSplit;
            const span=document.createElement('div');
            span.style.cssText=`position:absolute;top:2px;left:2px;width:${seatsHere*17-4}px;font-size:9px;font-weight:500;color:${c.text};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;z-index:2;pointer-events:none;`;
            span.textContent=occupiedBy.g.name;
            div.style.position='relative';
            div.appendChild(span);

            const tipContent=`<strong>${occupiedBy.g.name}</strong><br>${occupiedBy.g.count} ${occupiedBy.g.count===1?'person':'people'}${occupiedBy.g.isPAP?' · PAP':''}${occupiedBy.g.isCB?' · CB':''}<br>${fmtT(occupiedBy.startM)} – ${fmtT(occupiedBy.endM)}`;
            const tip=document.getElementById('bp-tooltip');
            td.addEventListener('mouseenter',e=>{tip.innerHTML=tipContent;tip.classList.add('visible');tip.style.left=Math.min(e.clientX+12,window.innerWidth-220)+'px';tip.style.top=(e.clientY-10)+'px';});
            td.addEventListener('mousemove',e=>{tip.style.left=Math.min(e.clientX+12,window.innerWidth-220)+'px';tip.style.top=(e.clientY-10)+'px';});
            td.addEventListener('mouseleave',()=>tip.classList.remove('visible'));
            td.addEventListener('touchstart',e=>{tip.innerHTML=tipContent;tip.classList.add('visible');tip.style.left='50%';tip.style.transform='translateX(-50%)';tip.style.top='80px';setTimeout(()=>tip.classList.remove('visible'),2500);},{passive:true});
          }
          td.appendChild(div);
        }
        tr.appendChild(td);
      }
    });
    tbody.appendChild(tr);
  });

  tbl.appendChild(tbody);
  tableWrap.appendChild(tbl);
  el.appendChild(tableWrap);

  const btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:8px;';
  btns.innerHTML=`<button class="reset-btn" style="flex:1;" onclick="tableAssignments={};fetchAndRenderBookings();">Refresh</button><button class="reset-btn" style="flex:1;" onclick="gcalToken=null;localStorage.removeItem('gcal_token');renderBookings();">Sign out</button>`;
  el.appendChild(btns);
}

function gcalSignIn() {
  if (GCAL_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') {
    renderBookingSetup();
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope: GCAL_SCOPES,
    callback: (tokenResponse) => {
      gcalToken = tokenResponse.access_token;
      localStorage.setItem('gcal_token', gcalToken);
      fetchAndRenderBookings();
    },
  });
  client.requestAccessToken();
}

async function fetchAndRenderBookings(silent = false) {
  const el = document.getElementById('bookings-content');
  if (!silent) el.innerHTML = `<div style="text-align:center;padding:40px 16px;color:var(--ink-mid);font-size:14px;">Loading bookings…</div>`;

  const now = new Date();
  const start = new Date(now); start.setHours(0,0,0,0);
  const end = new Date(now); end.setHours(23,59,59,999);

  const params = new URLSearchParams({
    calendarId: GCAL_ID,
    timeMin: start.toISOString(),
    timeMax: end.toISOString(),
    singleEvents: 'true',
    orderBy: 'startTime',
    maxResults: '250',
  });

  try {
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GCAL_ID)}/events?${params}`, {
      headers: { Authorization: `Bearer ${gcalToken}` }
    });
    if (res.status === 401) {
      gcalToken = null;
      localStorage.removeItem('gcal_token');
      renderBookings();
      return;
    }
    const data = await res.json();
    const groups = parseBookings(data.items || []);
    cachedBookingGroups = groups;
    autoAssign(groups);
    if (!silent) renderBookingPlan(groups);
  } catch(err) {
    if (!silent) el.innerHTML = `<div style="text-align:center;padding:40px 16px;color:var(--ink-mid);font-size:14px;">Could not load bookings. Please try again.</div>
      <button class="reset-btn" onclick="renderBookings()">Retry</button>`;
  }
}

// ── CELEBRATIONS ─────────────────────────────────────────────────────────────
function launchSunshine() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cx = canvas.width / 2;
  const cy = canvas.height * 0.38;
  const rays = 16;
  let frame, elapsed = 0;
  const maxFrames = 90;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elapsed++;
    const progress = elapsed / maxFrames;
    const alpha = progress < 0.6 ? progress / 0.6 : (1 - progress) / 0.4;
    ctx.globalAlpha = Math.max(0, alpha);

    // Rays
    const rayLen = 80 + Math.sin(elapsed * 0.15) * 12;
    ctx.strokeStyle = '#F5C842';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < rays; i++) {
      const angle = (i / rays) * Math.PI * 2 + elapsed * 0.02;
      const inner = 38 + Math.sin(elapsed * 0.1 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
      ctx.lineTo(cx + Math.cos(angle) * (inner + rayLen * 0.5), cy + Math.sin(angle) * (inner + rayLen * 0.5));
      ctx.stroke();
    }

    // Sun circle
    ctx.fillStyle = '#F5C842';
    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, Math.PI * 2);
    ctx.fill();

    // Smiley face
    ctx.fillStyle = '#B8710A';
    ctx.globalAlpha = Math.max(0, alpha);
    // Eyes
    ctx.beginPath(); ctx.arc(cx - 11, cy - 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 11, cy - 8, 4, 0, Math.PI * 2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#B8710A'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy + 2, 14, 0.2, Math.PI - 0.2);
    ctx.stroke();

    if (elapsed < maxFrames) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  if (frame) cancelAnimationFrame(frame);
  draw();
}

function launchMoon() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cx = canvas.width / 2;
  const cy = canvas.height * 0.38;
  let frame, elapsed = 0;
  const maxFrames = 100;

  // Stars
  const stars = Array.from({length: 20}, () => ({
    x: cx + (Math.random() - 0.5) * 220,
    y: cy + (Math.random() - 0.5) * 180,
    r: 1 + Math.random() * 2.5,
    phase: Math.random() * Math.PI * 2,
  }));

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elapsed++;
    const progress = elapsed / maxFrames;
    const alpha = progress < 0.5 ? progress / 0.5 : (1 - progress) / 0.5;
    ctx.globalAlpha = Math.max(0, alpha);

    // Twinkling stars
    stars.forEach(s => {
      const twinkle = 0.5 + 0.5 * Math.sin(elapsed * 0.18 + s.phase);
      ctx.globalAlpha = Math.max(0, alpha) * twinkle;
      ctx.fillStyle = '#E8D5F5';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = Math.max(0, alpha);

    // Moon crescent
    ctx.fillStyle = '#C4B5E8';
    ctx.beginPath();
    ctx.arc(cx, cy, 38, 0, Math.PI * 2);
    ctx.fill();
    // Cutout to make crescent
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx + 20, cy - 8, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.globalAlpha = Math.max(0, alpha);

    // Face on moon
    ctx.fillStyle = '#534AB7';
    ctx.beginPath(); ctx.arc(cx - 8, cy - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4, cy - 10, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#534AB7'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx - 2, cy + 5, 10, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // Small stars/sparkles around moon
    const sparkAngles = [0.3, 1.1, 2.0, 2.8, 4.2, 5.1];
    sparkAngles.forEach((a, i) => {
      const dist = 65 + Math.sin(elapsed * 0.12 + i) * 8;
      const sx = cx + Math.cos(a + elapsed * 0.015) * dist;
      const sy = cy + Math.sin(a + elapsed * 0.015) * dist;
      ctx.fillStyle = '#C4B5E8';
      ctx.globalAlpha = Math.max(0, alpha) * (0.5 + 0.5 * Math.sin(elapsed * 0.2 + i * 1.3));
      ctx.beginPath();
      ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    if (elapsed < maxFrames) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  if (frame) cancelAnimationFrame(frame);
  draw();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadFromSupabase();
  document.getElementById('loading-screen').classList.add('hidden');
  renderToday();
  renderWeeklySummary();
  // Load calendar in background so booking summary shows on Today tab
  if (GCAL_CLIENT_ID !== 'YOUR_GOOGLE_CLIENT_ID') {
    const stored = localStorage.getItem('gcal_token');
    if (stored) {
      gcalToken = stored;
      fetchAndRenderBookings(true).then(() => {
        // Re-render Today once bookings are loaded so the row appears
        if (document.getElementById('today-view').classList.contains('active')) {
          renderToday();
        }
      });
    }
  }
}

init();
</script>
