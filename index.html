  :root {
    --clay: #C4714A; --clay-light: #F5EBE4; --clay-dark: #8B4D2F;

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button, [onclick] { touch-action: manipulation; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--white); color: var(--ink); min-height: 100vh; }

  /* LOADING SCREEN */
  #loading-screen { position: fixed; inset: 0; background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 14px; }
  #loading-screen.hidden { display: none; }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--ink-faint); border-top-color: var(--clay); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--ink-mid); }

  /* SYNC INDICATOR */
  #sync-indicator { position: fixed; bottom: 14px; right: 14px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 99px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #sync-indicator.saving { background: var(--amber-light); color: var(--amber); opacity: 1; }
  #sync-indicator.saved { background: var(--green-light); color: var(--green); opacity: 1; }
  #sync-indicator.error { background: #FAECE7; color: #993C1D; opacity: 1; }

  /* NAV */
  .nav { display: flex; background: var(--ink); position: sticky; top: 0; z-index: 100; padding: 0 4px; gap: 4px; }
  .nav-btn { flex: 1; padding: 10px 6px; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.45); background: none; border: none; cursor: pointer; letter-spacing: 0.02em; transition: all 0.15s; border-radius: 8px 8px 0 0; line-height: 1.3; }
  .nav-btn .nav-icon { display: block; font-size: 16px; margin-bottom: 2px; }
  .nav-btn.active { color: #fff; background: rgba(255,255,255,0.12); border-bottom: 2.5px solid var(--clay); }

  /* VIEWS */
  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  /* DAY TABS */

  /* PROGRESS */
  .progress-wrap { background: var(--ink-faint); border-radius: 99px; height: 5px; margin-bottom: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--clay); transition: width 0.4s ease, background 0.4s ease; }
  .progress-label { font-size: 12px; color: var(--ink-mid); margin-bottom: 16px; }

  /* SECTION */
  .section-head { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mid); margin: 18px 0 8px; }
  .section-head:first-of-type { margin-top: 0; }

  /* TASK CARD */
  .task { display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: opacity 0.2s; user-select: none; }
  .task.done { opacity: 0.38; }
  .task.done .task-name { text-decoration: line-through; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-faint); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .check-icon { display: none; width: 12px; height: 12px; }
  .task.done .check-icon { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; line-height: 1.35; color: var(--ink); }
  .task-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
  .badge-time { background: var(--ink-faint); color: var(--ink-mid); }
  .badge-type-clean { background: #E8F0FB; color: #2A5BA8; }
  .badge-type-organise { background: #E4F2EB; color: #2A7A52; }

  /* MANAGER VIEW */

  .reset-btn { width: 100%; margin-top: 20px; padding: 13px; font-size: 14px; font-weight: 500; color: var(--ink-mid); background: none; border: 1.5px solid var(--ink-faint); border-radius: var(--radius); cursor: pointer; }
  .reset-btn:active { background: var(--ink-faint); }

  /* CRAFTER COUNTER */

  .bp-tooltip { position:fixed; background:var(--ink); color:#fff; font-size:12px; padding:8px 10px; border-radius:var(--radius-sm); pointer-events:none; z-index:9999; max-width:200px; line-height:1.5; display:none; }
  .bp-tooltip.visible { display:block; }
  .oc-panel { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .oc-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
  .oc-header-left { display: flex; align-items: center; gap: 10px; }

  .oc-progress-fill { height: 100%; border-radius: 99px; }
  .oc-progress-fill.open { background: var(--green); }

  .oc-progress-label { font-size: 12px; color: var(--ink-mid); margin-bottom: 10px; }

  .ai-result { background: #fff; border: 1px solid var(--ink-faint); border-radius: var(--radius); padding: 14px 16px; font-size: 13px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; margin-bottom: 12px; }

  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }

  .oc-pip.done { background: var(--green-light); }
  .oc-pip.not-done { background: var(--ink-faint); }

// ── STATE ─────────────────────────────────────────────────────────────────────
let shopOpen = {};   // {dateKey: bool}
let shopClosed = {}; // {dateKey: bool}
let dailyTasks = {}; // {dateKey: [{id, name, done}]}
let selectedDateOffset = 0; // 0 = today, +1 = tomorrow, -1 = yesterday
let notes = {};      // {dateKey: {well, improve, ideas, rating}}
let crafters = {};   // kept for bookings tab crafter count


// ── SUPABASE SYNC ─────────────────────────────────────────────────────────────
let saveTimer = null;
let isLoaded = false; // guard: never save before initial load completes

async function loadFromSupabase() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/weekly_data?id=eq.${ROW_ID}&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    console.log('Supabase load:', rows?.length, 'rows', rows?.[0] ? 'has data' : 'empty');
    if (rows && rows[0]) {
      shopOpen    = rows[0].shop_open    || {};
      shopClosed  = rows[0].shop_closed  || {};
      dailyTasks  = rows[0].daily_tasks  || {};
      notes       = rows[0].notes        || {};
      crafters    = rows[0].crafters     || {};
    }
    // If rows is empty array, row doesn't exist yet — that's fine, start fresh
  } catch(e) {
    console.error('Load error:', e);
  } finally {
    isLoaded = true;
  }
}

async function persistToSupabase() {
  if (window._realtimeLastSave) window._realtimeLastSave();
  showSync('saving');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/weekly_data`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        id: ROW_ID,
        shop_open: shopOpen, shop_closed: shopClosed,
        daily_tasks: dailyTasks, notes, crafters,
        updated_at: new Date().toISOString()
      })
    });
    if (!res.ok) {
      const text = await res.text();
      console.error('Save failed:', res.status, text);
      showSync('error');
    } else {
      console.log('Saved OK', res.status);
      showSync('saved');
    }
  } catch(e) {
    console.error('Save error:', e);
    showSync('error');
  }
}

// Debounce saves — waits 800ms after last change before hitting Supabase
function save() {
  if (!isLoaded) return; // never overwrite Supabase before we've loaded from it
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistToSupabase, 800);
}

function showSync(state) {
  const el = document.getElementById('sync-indicator');
  el.className = state;
  el.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? '✓ Saved' : '⚠ Sync error';
  if (state === 'saved') setTimeout(() => { el.className = ''; }, 2000);
}

// ── REALTIME SYNC ─────────────────────────────────────────────────────────────
function startRealtimeSync() {
  // Use Supabase Realtime via WebSocket
  const wsUrl = SUPABASE_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0';
  let ws;
  let reconnectTimer;
  let heartbeatTimer;
  let lastSaveTime = 0;

  function connect() {
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      // Join the channel for weekly_data table
      ws.send(JSON.stringify({
        topic: 'realtime:public:weekly_data',
        event: 'phx_join',
        payload: { config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: [{ event: 'UPDATE', schema: 'public', table: 'weekly_data', filter: `id=eq.${ROW_ID}` }] } },
        ref: '1'
      }));
      // Heartbeat every 30s to keep connection alive
      heartbeatTimer = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: null }));
        }
      }, 30000);
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.event === 'postgres_changes' && msg.payload?.data?.record) {
          const record = msg.payload.data.record;
          // Ignore if we just saved (within 3 seconds) — that's our own change
          if (Date.now() - lastSaveTime < 3000) return;
          // Update state from remote
          shopOpen    = record.shop_open    || {};
          shopClosed  = record.shop_closed  || {};
          dailyTasks  = record.daily_tasks  || {};
          notes       = record.notes        || {};
          crafters    = record.crafters     || {};
          // Re-render current view
          const activeView = document.querySelector('.view.active')?.id;
          if (activeView === 'today-view') renderToday();
          if (activeView === 'manager-view') renderManager();
          showSync('saved');
        }
      } catch(e) {}
    };

    ws.onclose = () => {
      clearInterval(heartbeatTimer);
      // Reconnect after 5s
      reconnectTimer = setTimeout(connect, 5000);
    };

    ws.onerror = () => ws.close();
  }

  connect();

  // Track when we last saved so we don't re-render our own changes
  const origPersist = persistToSupabase;
  window._realtimeLastSave = () => { lastSaveTime = Date.now(); };
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function selectedDk() {
  const d = new Date();
  d.setDate(d.getDate() + selectedDateOffset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addDailyTask(name) {
  if (!name.trim()) return;
  const dk = selectedDk();
  if (!dailyTasks[dk]) dailyTasks[dk] = [];
  dailyTasks[dk].push({ id: Date.now().toString(), name: name.trim(), done: false });
  save(); renderToday();
}

function toggleDailyTask(id) {
  const dk = selectedDk();
  const t = (dailyTasks[dk]||[]).find(t => t.id === id);
  if (t) { t.done = !t.done; save(); renderToday(); }
}

function deleteDailyTask(id) {
  const dk = selectedDk();
  dailyTasks[dk] = (dailyTasks[dk]||[]).filter(t => t.id !== id);
  save(); renderToday();
}

  const dk = selectedDk();

  if (!notes[dk]) notes[dk] = {};
  notes[dk].rating = notes[dk].rating === val ? 0 : val;
  save(); renderToday();
}

function renderStaff() { renderToday(); }

// ── RENDER: TODAY VIEW ────────────────────────────────────────────────────────
function renderToday() {
  // Date based on offset
  const baseDate = new Date();
  baseDate.setDate(baseDate.getDate() + selectedDateOffset);
  const dk = baseDate.toISOString().split('T')[0];
  const isToday = selectedDateOffset === 0;

  const el = document.getElementById('today-content');
  el.innerHTML = '';

  const now = new Date();
  const hour = now.getHours();
  const greeting = isToday
    ? (hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening')
    : selectedDateOffset > 0 ? 'Planning ahead' : 'Looking back';
  const dateStr = baseDate.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  const msgs = hour < 12
    ? ['Hope you have a wonderful day in the shop!','Ready to create something lovely today?','A tidy shop is a happy shop.','Another day, another chance to make something beautiful.']
    : ['Afternoon energy — push through!','Great work so far today!','Almost there — finish strong!'];
  const msg = isToday ? msgs[now.getDate() % msgs.length] : '';

  // Booking summary for selected date
  let bookingSentence = '';
  if (cachedBookingGroups) {
    const dayGroups = cachedBookingGroups.filter(g => g.startTime.startsWith(dk));
    if (dayGroups.length) {
      const total = dayGroups.reduce((s,g)=>s+g.count,0);
      const slots = {};
      dayGroups.forEach(g => { const sk=slotKey(g); slots[sk]=(slots[sk]||0)+g.count; });
      const peak = Math.max(...Object.values(slots));
      const peakEntry = Object.entries(slots).find(([,v])=>v===peak);
      const peakLabel = peakEntry ? formatTime(peakEntry[0].split('|')[0]) : null;
      bookingSentence = `<div style="font-size:14px;color:var(--ink-mid);line-height:1.6;margin-top:6px;">🎨 ${dayGroups.length} group${dayGroups.length!==1?'s':''} · ${total} crafter${total!==1?'s':''} today${peak>=15?` · <span style="color:#993C1D;font-weight:500;">🔥 Busy at ${peakLabel}</span>`:''}</div>`;
    }
  }

  // Date nav
  const navEl = document.createElement('div');
  navEl.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;';
  navEl.innerHTML = `
    <button onclick="selectedDateOffset=Math.max(-1,selectedDateOffset-1);renderToday();" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink-faint);background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;${selectedDateOffset<=-1?'opacity:0.3;pointer-events:none;':''}">‹</button>
    <div style="text-align:center;">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-mid);">${isToday?'Today':selectedDateOffset===1?'Tomorrow':selectedDateOffset===-1?'Yesterday':dateStr}</div>
      <div style="font-size:13px;color:var(--ink-mid);">${dateStr}</div>
    </div>
    <button onclick="selectedDateOffset=Math.min(6,selectedDateOffset+1);renderToday();" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink-faint);background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;${selectedDateOffset>=6?'opacity:0.3;pointer-events:none;':''}">›</button>`;
  el.appendChild(navEl);

  // Hero
  const hero = document.createElement('div');
  hero.style.cssText = 'margin-bottom:16px;';
  hero.innerHTML = `
    <div style="font-size:24px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:6px;">${greeting} 👋</div>
    ${msg ? `<div style="font-size:14px;color:var(--ink-mid);line-height:1.5;">${msg}</div>` : ''}
    ${bookingSentence}`;
  el.appendChild(hero);

  // Shop Open
  const isOpen = !!shopOpen[dk];
  const openEl = document.createElement('div');
  openEl.style.cssText = `background:${isOpen?'#FFFDF0':'#fff'};border:${isOpen?'2px solid #D4AA00':'1px solid var(--ink-faint)'};border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.2s;`;
  openEl.innerHTML = `
    <div style="width:28px;height:28px;border-radius:50%;border:2px solid ${isOpen?'#D4AA00':'var(--ink-faint)'};background:${isOpen?'#D4AA00':'#fff'};flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;">
      ${isOpen?'<svg viewBox="0 0 12 12" fill="none" width="13" height="13"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
    </div>
    <div>
      <div style="font-size:15px;font-weight:500;color:var(--ink);">☀️ Shop open</div>

  // Today tasks

  const taskWrap = document.createElement('div');

  input.onkeydown = (e) => { if(e.key==='Enter'&&input.value.trim()){ addDailyTask(input.value); input.value=''; } };

  taskWrap.appendChild(taskList);

function toggleTodayNotes(hdr) {

// ── RENDER: MANAGER VIEW ──────────────────────────────────────────────────────
function switchView(v, btn) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  if (btn) btn.classList.add('active');
  if (v==='manager') renderManager();
  if (v==='today') renderToday();
  if (v==='bookings') renderBookings();
}

function renderManager() {
  const el = document.getElementById('mgrCards');
  el.innerHTML = '';
  document.getElementById('mgrOcWeek').innerHTML = '';
  document.getElementById('mgrNotesSummary').innerHTML = '';
  document.getElementById('mgrAiSummary').innerHTML = '';

  const dk = todayKey();

  // ── All days with data, most recent first ────────────────────────────────
  const allKeys = [...new Set([
    ...Object.keys(dailyTasks),
    ...Object.keys(notes),
    ...Object.keys(shopOpen),
    ...Object.keys(shopClosed)
  ])].sort().reverse().slice(0, 30);

  if (!allKeys.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--ink-mid);font-size:14px;">No data yet — start by opening the shop today!</div>';
    return;
  }

  allKeys.forEach(dateKey => {
    const dayTasks  = dailyTasks[dateKey] || [];
    const dayNotes  = notes[dateKey] || {};
    const dayOpen   = !!shopOpen[dateKey];
    const dayClosed = !!shopClosed[dateKey];
    const doneTasks = dayTasks.filter(t => t.done).length;
    const totalTasks = dayTasks.length;
    const pct = totalTasks ? Math.round(doneTasks / totalTasks * 100) : null;
    const isToday = dateKey === dk;

    const d = new Date(dateKey + 'T12:00:00');
    const label = isToday
      ? 'Today'
      : d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'});

    const smooth = dayOpen && dayClosed;
    const emoji = smooth ? '✨' : (dayOpen || dayClosed) ? '🙂' : '—';
    const borderColor = smooth ? '#1D9E75' : isToday ? 'var(--clay)' : 'var(--ink-faint)';
    const pctColor = pct === 100 ? '#1D9E75' : pct !== null && pct >= 50 ? 'var(--amber)' : 'var(--clay)';

    const card = document.createElement('div');
    card.style.cssText = `background:#fff;border:${isToday||smooth?'1.5px':'1px'} solid ${borderColor};border-radius:var(--radius);margin-bottom:8px;overflow:hidden;`;

    // Header row
    const hdr = document.createElement('div');
    hdr.style.cssText = 'padding:11px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;';

    const left = document.createElement('div');
    left.style.cssText = 'display:flex;align-items:center;gap:8px;';
    left.innerHTML = `<span style="font-size:14px;">${emoji}</span><span style="font-size:13px;font-weight:500;color:var(--ink);">${label}</span>`;

    const right = document.createElement('div');
    right.style.cssText = 'display:flex;align-items:center;gap:5px;';

    // Progress pill
    if (pct !== null) {
      const pill = document.createElement('span');
      pill.style.cssText = `font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:${pct===100?'#E1F5EE':pct>=50?'#FDF0DC':'#FAECE7'};color:${pctColor};`;
      pill.textContent = pct === 100 ? '✓ All done' : `${doneTasks}/${totalTasks} tasks`;
      right.appendChild(pill);
    }

    // Open/closed badges
    const openBadge = document.createElement('span');
    openBadge.style.cssText = `font-size:10px;font-weight:500;padding:1px 5px;border-radius:3px;background:${dayOpen?'#E1F5EE':'#FAECE7'};color:${dayOpen?'#0F6E56':'#993C1D'};`;
    openBadge.textContent = '☀️';
    const closeBadge = document.createElement('span');
    closeBadge.style.cssText = `font-size:10px;font-weight:500;padding:1px 5px;border-radius:3px;background:${dayClosed?'#E1F5EE':'#FAECE7'};color:${dayClosed?'#0F6E56':'#993C1D'};`;
    closeBadge.textContent = '🌙';

    const chev = document.createElement('span');
    chev.style.cssText = 'font-size:10px;color:var(--ink-mid);';
    chev.textContent = '▾';

    right.appendChild(openBadge);
    right.appendChild(closeBadge);
    right.appendChild(chev);

    hdr.appendChild(left);
    hdr.appendChild(right);

    // Expandable body
    const body = document.createElement('div');
    body.style.cssText = 'display:none;border-top:0.5px solid var(--ink-faint);padding:10px 14px 12px;';

    // Progress bar
    if (pct !== null) {
      body.innerHTML += `
        <div style="background:var(--ink-faint);border-radius:99px;height:5px;overflow:hidden;margin-bottom:8px;">
          <div style="height:100%;border-radius:99px;background:${pctColor};width:${pct}%;transition:width 0.4s;"></div>
        </div>`;
    }

    // Task list
    if (dayTasks.length) {
      const taskHtml = dayTasks.map(t =>
        `<div style="font-size:12px;color:var(--ink);padding:3px 0;display:flex;align-items:center;gap:6px;${t.done?'opacity:0.45;':''}">
          <span style="color:${t.done?'#1D9E75':'var(--ink-faint)'};">${t.done?'✓':'○'}</span>
          <span style="${t.done?'text-decoration:line-through;':''}">${t.name}</span>
        </div>`).join('');
      body.innerHTML += `<div style="margin-bottom:${dayNotes.dayNote||dayNotes.well||dayNotes.improve||dayNotes.ideas?'10px':'0'}">${taskHtml}</div>`;
    }

    // Day note
    if (dayNotes.dayNote) {
      body.innerHTML += `<div style="background:#F8F6F3;border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:8px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:3px;">📝 Notes</div>
        <div style="font-size:12px;color:var(--ink);line-height:1.5;">${dayNotes.dayNote}</div>
      </div>`;
    }

    // End of day notes
    const noteFields = [{key:'well',label:'What went well',icon:'✅'},{key:'improve',label:'Could be improved',icon:'💡'},{key:'ideas',label:'Ideas & shopping',icon:'🛒'}];
    noteFields.forEach(({key:fk, label:fl, icon}) => {
      if (!dayNotes[fk]) return;
      body.innerHTML += `<div style="margin-top:6px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:2px;">${icon} ${fl}</div>
        <div style="font-size:12px;color:var(--ink);line-height:1.5;">${dayNotes[fk]}</div>
      </div>`;
    });

    // Star rating
    if (dayNotes.rating) {
      body.innerHTML += `<div style="margin-top:8px;font-size:13px;color:#F5C842;">${'★'.repeat(dayNotes.rating)}${'☆'.repeat(5-dayNotes.rating)}</div>`;
    }

    hdr.onclick = () => {
      const isOpen = body.style.display === 'block';
      body.style.display = isOpen ? 'none' : 'block';
      chev.style.transform = isOpen ? '' : 'rotate(180deg)';
    };

    card.appendChild(hdr);
    card.appendChild(body);
    el.appendChild(card);
  });

  renderHistory();
}


// ── RESET ALL ─────────────────────────────────────────────────────────────────
function resetAll() {
  if (!confirm('Reset all tasks, crafter counts and notes for the week? This cannot be undone.')) return;
  shopOpen={}; shopClosed={}; dailyTasks={}; notes={}; crafters={};
  save(); renderStaff(); renderManager();
}

// ── ARCHIVE ───────────────────────────────────────────────────────────────────
async function archiveWeek() {
  const btn = event.currentTarget;
  btn.disabled = true;
  btn.textContent = 'Archiving…';

  // week_ending = most recent Friday
  const today = new Date();
  const day = today.getDay();
  const diff = day <= 5 ? (day === 0 ? 6 : day - 5 + 7) % 7 : 0;
  const friday = new Date(today);
  friday.setDate(today.getDate() - (day === 5 ? 0 : (day < 5 ? day + 2 : day - 5)));
  const weekEnding = friday.toISOString().split('T')[0];

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/weekly_archive`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        week_ending: weekEnding,
        shop_open: shopOpen, shop_closed: shopClosed,
        daily_tasks: dailyTasks, notes, crafters
      })
    });
    if (res.ok) {
      btn.textContent = '✓ Archived!';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Archive this week'; }, 2500);
      renderHistory();
    } else {
      throw new Error('Archive failed');
    }
  } catch(e) {
    btn.disabled = false;

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colours = ['#C4714A','#2A7A52','#B8710A','#2A5BA8','#9F4AB0','#E05B8C','#F5C842'];
  const pieces = Array.from({length:120},()=>({
    x:Math.random()*canvas.width, y:Math.random()*-canvas.height,
    w:6+Math.random()*8, h:10+Math.random()*6,
    color:colours[Math.floor(Math.random()*colours.length)],
    rot:Math.random()*360, rotSpeed:(Math.random()-0.5)*6,
    vx:(Math.random()-0.5)*3, vy:3+Math.random()*4, opacity:1,
  }));
  let frame, elapsed=0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height); elapsed++;
    let alive=false;
    pieces.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotSpeed;
      if (elapsed>80) p.opacity=Math.max(0,p.opacity-0.015);
      if (p.y<canvas.height+20) alive=true;
      ctx.save(); ctx.globalAlpha=p.opacity; ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (alive) frame=requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  if (frame) cancelAnimationFrame(frame); draw();
}

function parseBookings(events) {
  const sessionEvents = events.filter(e => {
    const s = e.summary || '';
    if (s.startsWith('[CB]')) return false;
    return true;
  });
  const groupMap = {};
  sessionEvents.forEach(e => {
    const raw = e.summary || '';
    const nameMatch = raw.match(/^(.+?):/);
    if (!nameMatch) return;
    let name = nameMatch[1].trim();
    const isPAP = /PAP/i.test(name) || /paint.a.pot/i.test(raw);
    const isCB = /class.?bento/i.test(name) || /classbento/i.test(e.creator?.email||'');
    const typeMatch = raw.match(/\(([^)]+)\)$/);
    const sessionType = typeMatch ? typeMatch[1] : '';
    const isClass = sessionType === 'Classes' || /watercolour|clay|embroidery/i.test(raw);
    name = name.replace(/\s*PAP\s*/gi,'').replace(/\s*Class\s*Bento\s*/gi,'').replace(/\s*CLAY\s*/gi,'').trim();
    const startTime = e.start?.dateTime || '';
    const endTime = e.end?.dateTime || '';
    const gKey = name + '|' + startTime;
    if (!groupMap[gKey]) {
      groupMap[gKey] = {name, startTime, endTime, count:0, isPAP, isCB, isClass, sessionType, key:gKey};
    }
    groupMap[gKey].count++;
  });
  return Object.values(groupMap).sort((a,b) => a.startTime.localeCompare(b.startTime));
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  const hh = h % 12 || 12;
  return `${hh}${m ? ':'+String(m).padStart(2,'0') : ''} ${ampm}`;
}

function formatDateShort(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}

function slotKey(group) { return group.startTime+'|'+group.endTime; }
function getAssignment(slotK, groupKey) { return (tableAssignments[slotK]||{})[groupKey]||null; }
function setAssignment(slotK, groupKey, tableId) {
  if (!tableAssignments[slotK]) tableAssignments[slotK] = {};
  if (tableId===null) delete tableAssignments[slotK][groupKey];
  else tableAssignments[slotK][groupKey] = tableId;
}

function autoAssign(groups) {
  const T = [
    {id:'main',   seats:10, shareable:true},
    {id:'corner', seats:6,  shareable:true},
    {id:'window', seats:6,  shareable:true},
    {id:'back',   seats:10, shareable:false},
  ];
  const SPLIT_PAIRS = [['main','corner'],['corner','window']];

  const slots = {};
  groups.forEach(g => { const sk=slotKey(g); if(!slots[sk]) slots[sk]=[]; slots[sk].push(g); });

  Object.entries(slots).forEach(([sk, slotGroups]) => {
    const usage = {};
    T.forEach(t => { usage[t.id] = 0; });

    // Carry over existing manual assignments
    Object.entries(tableAssignments[sk]||{}).forEach(([gk, tid]) => {
      if (gk.endsWith('__split')) return;
      const g = slotGroups.find(g => g.key === gk || g.key.replace(/["|]/g,'_') === gk);
      if (g) usage[tid] = (usage[tid]||0) + g.count;
    });

    // Sort groups largest first so big groups get first pick
    const unassigned = slotGroups.filter(g => !getAssignment(sk, g.key))
      .sort((a,b) => b.count - a.count);

    unassigned.forEach(g => {
      // Large group: try split pair
      if (g.count > 12) {
        const pair = SPLIT_PAIRS.find(([a,b]) => {
          const ta=T.find(t=>t.id===a), tb=T.find(t=>t.id===b);
          return usage[a]===0 && usage[b]===0 && g.count <= ta.seats+tb.seats;
        });
        if (pair) {
          setAssignment(sk, g.key, pair[0]);
          if (!tableAssignments[sk]) tableAssignments[sk]={};
          tableAssignments[sk][g.key+'__split'] = pair[1];
          const ta=T.find(t=>t.id===pair[0]);
          const seatsOnA = Math.min(g.count, ta.seats);
          usage[pair[0]] += seatsOnA;
          usage[pair[1]] += g.count - seatsOnA;
          return;
        }
      }

      // Find the emptiest table that fits (prefer completely empty tables)
      const fits = T.filter(t => t.seats - usage[t.id] >= g.count);
      if (fits.length) {
        // Among tables that fit, pick the one with least usage (most empty)
        const best = fits.reduce((a,b) => usage[a.id] <= usage[b.id] ? a : b);
        setAssignment(sk, g.key, best.id);
        usage[best.id] += g.count;
      } else {
        // Overflow: pick table with most remaining space
        const best = T.reduce((a,b) => (b.seats-usage[b.id]) > (a.seats-usage[a.id]) ? b : a);
        setAssignment(sk, g.key, best.id);
        usage[best.id] += g.count;
      }
    });
  });
}

    name.textContent = g.name;
    const meta = document.createElement('div');
    meta.style.cssText = `display:flex;gap:4px;align-items:center;margin-top:2px;${isDone?'opacity:0.5;':''}`;
    meta.innerHTML = `<span style="font-size:11px;color:var(--ink-mid);">👥 ${g.count}</span>
      ${g.isPAP?'<span style="font-size:10px;font-weight:500;color:#712B13;background:#F5C4B3;padding:1px 4px;border-radius:3px;">PAP</span>':''}
      ${g.isCB?'<span style="font-size:10px;font-weight:500;color:#0C447C;background:#B5D4F4;padding:1px 4px;border-radius:3px;">CB</span>':''}`;;
    info.appendChild(name);
    info.appendChild(meta);

    row.appendChild(tick);
    row.appendChild(timeEl);
    row.appendChild(dot);
    row.appendChild(info);

    row.onclick = () => {
      bookingChecked[g.key] = !bookingChecked[g.key];
      renderBookingPlan(cachedBookingGroups);
    };

    listEl.appendChild(row);
  });
  el.appendChild(listEl);

  const btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:8px;';
  btns.innerHTML=`<button class="reset-btn" style="flex:1;" onclick="tableAssignments={};fetchAndRenderBookings();">Refresh</button><button class="reset-btn" style="flex:1;" onclick="gcalToken=null;localStorage.removeItem('gcal_token');renderBookings();">Sign out</button>`;
  el.appendChild(btns);
}

function gcalSignIn() {
  if (GCAL_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') {
    renderBookingSetup();
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope: GCAL_SCOPES,
    callback: (tokenResponse) => {
      gcalToken = tokenResponse.access_token;
      localStorage.setItem('gcal_token', gcalToken);
      fetchAndRenderBookings();
    },
  });
  client.requestAccessToken();
}

async function fetchAndRenderBookings(silent = false) {
  const el = document.getElementById('bookings-content');
  if (!silent) el.innerHTML = `<div style="text-align:center;padding:40px 16px;color:var(--ink-mid);font-size:14px;">Loading bookings…</div>`;

  const now = new Date();
  const start = new Date(now); start.setHours(0,0,0,0);
  const end = new Date(now); end.setDate(end.getDate()+6); end.setHours(23,59,59,999);

  const params = new URLSearchParams({
    calendarId: GCAL_ID,
    timeMin: start.toISOString(),
    timeMax: end.toISOString(),
    singleEvents: 'true',
    orderBy: 'startTime',
    maxResults: '250',
  });

  try {
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GCAL_ID)}/events?${params}`, {
      headers: { Authorization: `Bearer ${gcalToken}` }
    });
    if (res.status === 401) {
      gcalToken = null;
      localStorage.removeItem('gcal_token');
      renderBookings();
      return;
    }
    const data = await res.json();
    const groups = parseBookings(data.items || []);
    cachedBookingGroups = groups;
    selectedBookingDate = new Date().toISOString().split('T')[0];
    autoAssign(groups);
    if (!silent) renderBookingPlan(groups);
  } catch(err) {
    if (!silent) el.innerHTML = `<div style="text-align:center;padding:40px 16px;color:var(--ink-mid);font-size:14px;">Could not load bookings. Please try again.</div>
      <button class="reset-btn" onclick="renderBookings()">Retry</button>`;
  }
}

async function renderBookings() {
  const el = document.getElementById('bookings-content');

  if (GCAL_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') {
    renderBookingSetup();
    return;
  }

  // Try cached token first
  const stored = localStorage.getItem('gcal_token');
  if (stored) { gcalToken = stored; fetchAndRenderBookings(); return; }

  // Show sign in
  el.innerHTML = `
    <div style="text-align:center;padding:40px 16px;">
      <div style="font-size:18px;font-weight:500;color:var(--ink);margin-bottom:8px;">Connect Google Calendar</div>
      <div style="font-size:14px;color:var(--ink-mid);margin-bottom:24px;">Sign in to see today's bookings and build your table plan.</div>
      <button class="ai-summary-btn" style="max-width:260px;margin:0 auto;" onclick="gcalSignIn()">Sign in with Google</button>
    </div>`;
}

// ── CELEBRATIONS ─────────────────────────────────────────────────────────────
function launchSunshine() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cx = canvas.width / 2;
  const cy = canvas.height * 0.38;
  const rays = 16;
  let frame, elapsed = 0;
  const maxFrames = 90;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elapsed++;
    const progress = elapsed / maxFrames;
    const alpha = progress < 0.6 ? progress / 0.6 : (1 - progress) / 0.4;
    ctx.globalAlpha = Math.max(0, alpha);

    // Rays
    const rayLen = 80 + Math.sin(elapsed * 0.15) * 12;
    ctx.strokeStyle = '#F5C842';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < rays; i++) {
      const angle = (i / rays) * Math.PI * 2 + elapsed * 0.02;
      const inner = 38 + Math.sin(elapsed * 0.1 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
      ctx.lineTo(cx + Math.cos(angle) * (inner + rayLen * 0.5), cy + Math.sin(angle) * (inner + rayLen * 0.5));
      ctx.stroke();
    }

    // Sun circle
    ctx.fillStyle = '#F5C842';
    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, Math.PI * 2);
    ctx.fill();

    // Smiley face
    ctx.fillStyle = '#B8710A';
    ctx.globalAlpha = Math.max(0, alpha);
    // Eyes
    ctx.beginPath(); ctx.arc(cx - 11, cy - 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 11, cy - 8, 4, 0, Math.PI * 2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#B8710A'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy + 2, 14, 0.2, Math.PI - 0.2);
    ctx.stroke();

    if (elapsed < maxFrames) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  if (frame) cancelAnimationFrame(frame);
  draw();
}

function launchMoon() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cx = canvas.width / 2;
  const cy = canvas.height * 0.38;
  let frame, elapsed = 0;
  const maxFrames = 100;

  // Stars
  const stars = Array.from({length: 20}, () => ({
    x: cx + (Math.random() - 0.5) * 220,
    y: cy + (Math.random() - 0.5) * 180,
    r: 1 + Math.random() * 2.5,
    phase: Math.random() * Math.PI * 2,
  }));

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elapsed++;
    const progress = elapsed / maxFrames;
    const alpha = progress < 0.5 ? progress / 0.5 : (1 - progress) / 0.5;
    ctx.globalAlpha = Math.max(0, alpha);

    // Twinkling stars
    stars.forEach(s => {
      const twinkle = 0.5 + 0.5 * Math.sin(elapsed * 0.18 + s.phase);
      ctx.globalAlpha = Math.max(0, alpha) * twinkle;
      ctx.fillStyle = '#E8D5F5';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = Math.max(0, alpha);

    // Moon crescent
    ctx.fillStyle = '#C4B5E8';
    ctx.beginPath();
    ctx.arc(cx, cy, 38, 0, Math.PI * 2);
    ctx.fill();
    // Cutout to make crescent
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx + 20, cy - 8, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.globalAlpha = Math.max(0, alpha);

    // Face on moon
    ctx.fillStyle = '#534AB7';
    ctx.beginPath(); ctx.arc(cx - 8, cy - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4, cy - 10, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#534AB7'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx - 2, cy + 5, 10, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // Small stars/sparkles around moon
    const sparkAngles = [0.3, 1.1, 2.0, 2.8, 4.2, 5.1];
    sparkAngles.forEach((a, i) => {
      const dist = 65 + Math.sin(elapsed * 0.12 + i) * 8;
      const sx = cx + Math.cos(a + elapsed * 0.015) * dist;
      const sy = cy + Math.sin(a + elapsed * 0.015) * dist;
      ctx.fillStyle = '#C4B5E8';
      ctx.globalAlpha = Math.max(0, alpha) * (0.5 + 0.5 * Math.sin(elapsed * 0.2 + i * 1.3));
      ctx.beginPath();
      ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    if (elapsed < maxFrames) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  if (frame) cancelAnimationFrame(frame);
  draw();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  // Always hide loading screen after 5s max, even if Supabase fails
  const loadingTimeout = setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
    if (!isLoaded) { isLoaded = true; renderToday(); }
  }, 5000);

  await loadFromSupabase();
  clearTimeout(loadingTimeout);
  document.getElementById('loading-screen').classList.add('hidden');
  renderToday();
  startRealtimeSync();
  // Load calendar in background so booking summary shows on Today tab
  if (GCAL_CLIENT_ID !== 'YOUR_GOOGLE_CLIENT_ID') {
    const stored = localStorage.getItem('gcal_token');
    if (stored) {
      gcalToken = stored;
      fetchAndRenderBookings(true).then(() => {
        if (document.getElementById('today-view').classList.contains('active')) {
          renderToday();
        }
      });
    }
  }
}

init();
